<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Proveedores" />
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
<title>Proveedores in-cosmetics</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cabin:wght@500;600;700&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  /* Paleta in-cosmetics (tomada de in-cosmetics.com): cambiar acá para ajustar la marca */
  :root {
    --brand: #784A98;
    --brand-ink: #5E3A77;
    --brand-tint: #F2EDF5;
    --brand-soft: #D9C9E5;
    --bg: #FFFFFF;
    --surface: #F5F5F7;
    --surface-2: #E8E8ED;
    --line: #D2D2D7;
    --ink: #2D2D2D;
    --ink-2: #6E6E73;
    --ink-3: #A1A1A6;
    --glass: rgba(255,255,255,.78);
    --shadow-lg: 0 30px 80px rgba(0,0,0,.18);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Open Sans", "Helvetica Neue", Arial, sans-serif;
    --display: "Cabin", -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --brand: #A180B7;
      --brand-ink: #D9C9E5;
      --brand-tint: rgba(120,74,152,.24);
      --brand-soft: #5E3A77;
      --bg: #000000;
      --surface: #1C1C1E;
      --surface-2: #2C2C2E;
      --line: #3A3A3C;
      --ink: #F5F5F7;
      --ink-2: #A1A1A6;
      --ink-3: #6E6E73;
      --glass: rgba(0,0,0,.72);
      --shadow-lg: 0 30px 80px rgba(0,0,0,.7);
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font-family: var(--font); font-size: 17px; line-height: 1.4; letter-spacing: -.012em;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }
  button, input, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
  button { cursor: pointer; }
  img { display: block; }
  .hidden { display: none !important; }

  /* ---------- Barra ---------- */
  .nav {
    position: sticky; top: 0; z-index: 20;
    padding: env(safe-area-inset-top) 20px 0;
    background: var(--glass);
    backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: .5px solid transparent; transition: border-color .2s;
  }
  .nav.scrolled { border-bottom-color: var(--line); }
  .nav-inner { max-width: 1120px; margin: 0 auto; height: 52px; display: flex; align-items: center; justify-content: space-between; }
  .wordmark { font-family: var(--display); font-size: 20px; font-weight: 600; letter-spacing: -.01em; color: var(--brand); }
  .wordmark span { font-family: var(--font); font-size: 13px; font-weight: 500; color: var(--ink-2); margin-left: 8px; letter-spacing: 0; }
  .nav-title { font-size: 15px; font-weight: 600; opacity: 0; transition: opacity .2s; position: absolute; left: 50%; transform: translateX(-50%); }
  .nav.scrolled .nav-title { opacity: 1; }
  .ghost {
    border: none; background: none; color: var(--ink-2); width: 36px; height: 36px; border-radius: 50%;
    display: grid; place-items: center;
  }
  .ghost:hover { background: var(--surface); }
  .ghost svg { width: 20px; height: 20px; }

  main { max-width: 1120px; margin: 0 auto; padding: 28px 20px calc(env(safe-area-inset-bottom) + 120px); }
  .hero h1 { font-family: var(--display); font-size: clamp(40px, 7vw, 64px); font-weight: 700; letter-spacing: -.025em; line-height: 1.02; margin: 0; }
  .hero h1 span { color: var(--brand); }
  .hero p { color: var(--ink-2); font-size: clamp(17px, 2.2vw, 21px); margin: 10px 0 0; letter-spacing: -.015em; }

  .search {
    display: flex; align-items: center; gap: 10px; background: var(--surface);
    border-radius: 14px; padding: 0 14px; height: 48px; margin-top: 28px;
  }
  .search svg { width: 18px; height: 18px; color: var(--ink-2); flex: none; }
  .search input { border: none; background: none; outline: none; flex: 1; min-width: 0; font-size: 17px; }
  .search input::placeholder { color: var(--ink-3); }

  .filters { display: flex; gap: 8px; overflow-x: auto; padding: 16px 20px 2px; margin: 0 -20px; scrollbar-width: none; }
  .filters::-webkit-scrollbar { display: none; }
  .pill {
    border: 1px solid var(--line); background: var(--bg); padding: 7px 15px; border-radius: 999px;
    font-size: 14px; font-weight: 500; white-space: nowrap; color: var(--ink); transition: all .15s;
  }
  .pill:hover { border-color: var(--ink-3); }
  .pill.on { background: var(--brand); border-color: var(--brand); color: #fff; }

  /* ---------- Galería de proveedores ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(230px, 100%), 1fr)); gap: 36px 22px; margin-top: 32px; }
  .card { border: none; background: none; padding: 0; text-align: left; width: 100%; min-width: 0; display: flex; flex-direction: column; justify-content: flex-start; align-self: start; }
  .card-img {
    aspect-ratio: 4 / 5; border-radius: 20px; overflow: hidden; background: var(--surface); position: relative;
    transition: transform .45s cubic-bezier(.2,.8,.2,1), box-shadow .45s;
  }
  .card:hover .card-img { transform: scale(1.015); box-shadow: 0 20px 50px rgba(0,0,0,.12); }
  .card:active .card-img { transform: scale(.98); }
  .card-img img { width: 100%; height: 100%; object-fit: cover; }
  .card-img .n {
    position: absolute; right: 10px; bottom: 10px; font-size: 12px; font-weight: 600; color: #fff;
    background: rgba(0,0,0,.42); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    padding: 4px 9px; border-radius: 999px; display: flex; align-items: center; gap: 4px;
  }
  .card-img .n svg { width: 12px; height: 12px; }
  .initials {
    width: 100%; height: 100%; display: grid; place-items: center;
    background: linear-gradient(160deg, var(--brand-tint), var(--surface) 70%);
    color: var(--brand-ink); font-size: 44px; font-weight: 600; letter-spacing: -.03em;
  }
  .card h3 { font-family: var(--display); font-size: 19px; font-weight: 600; letter-spacing: -.02em; margin: 14px 2px 3px; }
  .card p { font-size: 14px; color: var(--ink-2); margin: 0 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card p.none { color: var(--ink-3); }
  .card .country { color: var(--ink); font-weight: 500; margin-bottom: 2px; }
  .d-country { font-size: 19px; color: var(--ink); margin: 8px 0 0; font-weight: 500; }

  .empty { text-align: center; padding: 72px 20px 20px; }
  .empty-art {
    width: 96px; height: 96px; border-radius: 28px; margin: 0 auto 22px; display: grid; place-items: center;
    background: var(--brand-tint); color: var(--brand-ink);
  }
  .empty-art svg { width: 44px; height: 44px; }
  .empty h2 { font-family: var(--display); font-size: 28px; letter-spacing: -.03em; margin: 0 0 8px; }
  .empty p { color: var(--ink-2); margin: 0 auto; max-width: 360px; }

  /* ---------- Botón flotante ---------- */
  .fab {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 22px); transform: translateX(-50%); z-index: 30;
    border: none; background: var(--brand); color: #fff; height: 54px; padding: 0 26px 0 20px; border-radius: 999px;
    font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 8px; white-space: nowrap;
    box-shadow: 0 10px 30px rgba(120,74,152,.4); transition: transform .2s;
  }
  .fab:active { transform: translateX(-50%) scale(.96); }
  .fab svg { width: 20px; height: 20px; }

  .btn {
    border: none; border-radius: 999px; padding: 13px 24px; font-size: 17px; font-weight: 600;
    background: var(--brand); color: #fff; display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:active { opacity: .8; }
  .btn.danger { background: none; color: #FF3B30; width: 100%; justify-content: center; }

  /* ---------- Hojas ---------- */
  dialog {
    border: none; padding: 0; background: var(--bg); color: var(--ink);
    width: 100%; max-width: 600px; height: 100%; max-height: 100%;
    margin: 0 auto; border-radius: 0; overflow: hidden; flex-direction: column;
  }
  dialog[open] { display: flex; animation: up .42s cubic-bezier(.2,.9,.25,1); }
  dialog::backdrop { background: rgba(0,0,0,.4); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); animation: fade .3s ease; }
  @keyframes up { from { transform: translateY(100%); } }
  @keyframes fade { from { opacity: 0; } }
  @keyframes pop { from { transform: scale(.96); opacity: 0; } }
  @media (min-width: 720px) {
    dialog { height: auto; max-height: 90vh; margin: auto; border-radius: 24px; box-shadow: var(--shadow-lg); }
    dialog[open] { animation: pop .3s cubic-bezier(.2,.9,.25,1); }
  }
  .bar {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; flex: none;
    padding: calc(env(safe-area-inset-top) + 10px) 20px 10px; border-bottom: .5px solid var(--line);
  }
  @media (min-width: 720px) { .bar { padding-top: 14px; } }
  .bar h2 { margin: 0; font-size: 17px; font-weight: 600; }
  .txt { border: none; background: none; color: var(--brand-ink); font-size: 17px; padding: 6px 0; justify-self: start; }
  .txt.end { justify-self: end; font-weight: 600; }
  .txt:disabled { color: var(--ink-3); }
  .scroll { overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch; }

  /* ---------- Formulario ---------- */
  .form { padding: 20px 20px calc(env(safe-area-inset-bottom) + 32px); }
  .dropzone {
    width: 100%; aspect-ratio: 4 / 3; border-radius: 20px; border: 1.5px dashed var(--line); background: var(--surface);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--ink-2);
    transition: all .2s;
  }
  .dropzone.over { border-color: var(--brand); background: var(--brand-tint); }
  .dropzone .cam {
    width: 60px; height: 60px; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center;
    box-shadow: 0 8px 20px rgba(120,74,152,.35);
  }
  .dropzone .cam svg { width: 28px; height: 28px; }
  .dropzone b { color: var(--ink); font-size: 17px; font-weight: 600; }
  .dropzone small { font-size: 14px; }
  .thumbs { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .thumbs::-webkit-scrollbar { display: none; }
  .thumb { position: relative; flex: none; width: 128px; aspect-ratio: 4 / 5; border-radius: 14px; overflow: hidden; background: var(--surface); }
  .thumb:first-child { width: 168px; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .thumb .rm {
    position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; border-radius: 50%; border: none;
    background: rgba(0,0,0,.5); color: #fff; display: grid; place-items: center; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .thumb .rm svg { width: 12px; height: 12px; }
  .thumb .cover-tag {
    position: absolute; left: 6px; bottom: 6px; font-size: 11px; font-weight: 600; color: #fff;
    background: rgba(0,0,0,.5); padding: 3px 8px; border-radius: 999px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .thumb .mk { position: absolute; inset: 0; border: none; background: none; }
  .thumb-add {
    flex: none; width: 128px; aspect-ratio: 4 / 5; border-radius: 14px; border: 1.5px dashed var(--line); background: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: var(--brand-ink); font-size: 14px; font-weight: 500;
  }
  .thumb-add svg { width: 26px; height: 26px; }
  .hint { font-size: 13px; color: var(--ink-3); margin: 8px 2px 0; }

  .field { margin-top: 26px; }
  .field > label { display: block; font-size: 13px; font-weight: 600; color: var(--ink-2); margin: 0 2px 8px; letter-spacing: 0; }
  .field > label i { font-style: normal; font-weight: 400; color: var(--ink-3); }
  .input {
    width: 100%; border: 1px solid transparent; background: var(--surface); border-radius: 14px;
    padding: 14px 16px; font-size: 17px; outline: none; transition: border-color .15s, background .15s;
  }
  .input:focus, .tagbox:focus-within { border-color: var(--brand); background: var(--bg); }
  .input.name { font-size: 22px; font-weight: 600; letter-spacing: -.02em; }
  .input::placeholder { color: var(--ink-3); font-weight: 400; }
  textarea.input { resize: vertical; min-height: 120px; line-height: 1.45; }
  .tagbox {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--surface); border: 1px solid transparent;
    border-radius: 14px; padding: 10px 12px; min-height: 52px; cursor: text; transition: border-color .15s, background .15s;
  }
  .tagbox input { flex: 1; min-width: 150px; border: none; background: none; outline: none; font-size: 17px; padding: 4px; }
  .tagbox input::placeholder { color: var(--ink-3); }
  .tag {
    display: inline-flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 500;
    padding: 6px 12px; border-radius: 999px; background: var(--brand-tint); color: var(--brand-ink); border: none;
  }
  .tag svg { width: 10px; height: 10px; opacity: .7; }

  /* ---------- Detalle ---------- */
  .d-bar { position: absolute; top: 0; left: 0; right: 0; z-index: 2; display: flex; justify-content: space-between; padding: calc(env(safe-area-inset-top) + 12px) 16px 0; pointer-events: none; }
  @media (min-width: 720px) { .d-bar { padding-top: 14px; } }
  .round {
    pointer-events: auto; border: none; height: 36px; min-width: 36px; padding: 0 12px; border-radius: 999px;
    background: rgba(0,0,0,.42); color: #fff; font-size: 15px; font-weight: 600;
    display: grid; place-items: center; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  }
  .round.icon { padding: 0; }
  .round svg { width: 16px; height: 16px; }
  .gallery-wrap { position: relative; background: var(--surface); }
  .gallery { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; aspect-ratio: 4 / 5; max-height: 64vh; width: 100%; }
  .gallery::-webkit-scrollbar { display: none; }
  .gallery img { flex: none; width: 100%; height: 100%; object-fit: cover; scroll-snap-align: center; cursor: zoom-in; }
  .gallery .initials { flex: none; font-size: 72px; }
  .dots { position: absolute; bottom: 14px; left: 0; right: 0; display: flex; justify-content: center; gap: 7px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.5); transition: background .2s; }
  .dots i.on { background: #fff; }
  .d-body { padding: 24px 20px calc(env(safe-area-inset-bottom) + 36px); }
  .d-body h1 { font-family: var(--display); font-size: 34px; font-weight: 700; letter-spacing: -.03em; line-height: 1.08; margin: 0; }
  .d-date { color: var(--ink-3); font-size: 14px; margin: 6px 0 0; }
  .d-sec { margin-top: 30px; }
  .d-sec h4 { font-size: 13px; font-weight: 600; color: var(--ink-2); margin: 0 0 12px; text-transform: uppercase; letter-spacing: .04em; }
  .d-tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .d-notes { font-size: 17px; white-space: pre-wrap; word-break: break-word; margin: 0; line-height: 1.5; }
  .d-photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .d-photos img, .d-photos button { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 12px; cursor: zoom-in; }
  .d-photos button {
    border: 1.5px dashed var(--line); background: none; color: var(--brand-ink); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 13px; font-weight: 500;
  }
  .d-photos button svg { width: 24px; height: 24px; }
  .muted { color: var(--ink-3); margin: 0; }

  #lightbox { background: #000; max-width: none; width: 100vw; height: 100vh; height: 100dvh; max-height: none; margin: 0; border-radius: 0; box-shadow: none; }
  #lightbox img { width: 100%; height: 100%; object-fit: contain; }
  #lightbox .round { position: absolute; top: calc(env(safe-area-inset-top) + 14px); right: 16px; background: rgba(255,255,255,.2); }

  /* ---------- Menú y aviso ---------- */
  .menu {
    position: fixed; z-index: 40; right: 16px; top: calc(env(safe-area-inset-top) + 52px); width: 260px;
    background: var(--glass); backdrop-filter: saturate(180%) blur(30px); -webkit-backdrop-filter: saturate(180%) blur(30px);
    border-radius: 16px; box-shadow: var(--shadow-lg); overflow: hidden; border: .5px solid var(--line);
    animation: pop .18s ease;
  }
  .menu button { display: block; width: 100%; border: none; background: none; padding: 13px 16px; font-size: 16px; text-align: left; }
  .menu button + button { border-top: .5px solid var(--line); }
  .menu button:hover { background: var(--surface); }
  .toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 92px); transform: translate(-50%, 16px);
    background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 999px; font-size: 15px; font-weight: 500;
    opacity: 0; transition: all .3s cubic-bezier(.2,.9,.25,1); pointer-events: none; z-index: 60; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 560px) {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 26px 12px; }
    .card-img { border-radius: 16px; }
    .card h3 { font-size: 16px; margin-top: 10px; }
    .card p { font-size: 13px; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, ::backdrop { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<header class="nav" id="nav">
  <div class="nav-inner">
    <div class="wordmark">in-cosmetics<span>Proveedores</span></div>
    <div class="nav-title">Proveedores</div>
    <button class="ghost" id="menuBtn" aria-label="Más opciones">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
    </button>
  </div>
</header>

<div class="menu hidden" id="menu">
  <button data-act="export">Descargar copia de seguridad</button>
  <button data-act="import">Restaurar copia</button>
  <button data-act="csv">Exportar a Excel</button>
</div>
<input type="file" id="importFile" accept="application/json,.json" hidden />

<main>
  <section class="hero">
    <h1>Proveedores<span>.</span></h1>
    <p id="lede">Quién trabaja qué, con fotos.</p>
  </section>

  <label class="search" id="searchBox">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Buscar proveedor, país o activo" autocomplete="off" />
  </label>
  <div class="filters" id="filters"></div>

  <section class="grid" id="grid"></section>
  <div class="empty hidden" id="empty"></div>
</main>

<button class="fab" id="addBtn">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  Nuevo proveedor
</button>

<!-- Formulario -->
<dialog id="formSheet">
  <div class="bar">
    <button class="txt" id="cancelBtn" type="button">Cancelar</button>
    <h2 id="formTitle">Nuevo proveedor</h2>
    <button class="txt end" id="saveBtn" type="button">Guardar</button>
  </div>
  <div class="scroll">
    <form class="form" id="form" autocomplete="off" onsubmit="return false">
      <div id="photos"></div>
      <input type="file" id="photoInput" accept="image/*" multiple hidden />

      <div class="field">
        <label for="f-name">Nombre del proveedor</label>
        <input class="input name" id="f-name" placeholder="Ej: Química Oriental" />
      </div>

      <div class="field">
        <label for="f-country">País</label>
        <input class="input" id="f-country" list="countryList" placeholder="Ej: Francia" autocomplete="off" />
        <datalist id="countryList"></datalist>
      </div>

      <div class="field">
        <label for="tagInput">Activos que trabaja</label>
        <div class="tagbox" id="tagBox">
          <input id="tagInput" list="tagList" placeholder="Escribí un activo y tocá Enter" enterkeyhint="done" />
        </div>
        <datalist id="tagList"></datalist>
      </div>

      <div class="field">
        <label for="f-notes">Notas <i>· opcional</i></label>
        <textarea class="input" id="f-notes" placeholder="Precios, contacto, calidad, lo que quieras recordar…"></textarea>
      </div>

      <div class="field hidden" id="deleteWrap">
        <button type="button" class="btn danger" id="deleteBtn">Eliminar proveedor</button>
      </div>
    </form>
  </div>
</dialog>

<!-- Detalle -->
<dialog id="detailSheet">
  <div class="d-bar">
    <button class="round icon" id="closeDetail" aria-label="Cerrar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <button class="round" id="editBtn">Editar</button>
  </div>
  <div class="scroll" id="detail"></div>
</dialog>
<input type="file" id="quickPhoto" accept="image/*" multiple hidden />

<dialog id="lightbox">
  <img id="lbImg" alt="" />
  <button class="round icon" id="lbClose" aria-label="Cerrar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
  </button>
</dialog>

<div class="toast" id="toast"></div>

<script>
(() => {
  // ---------- IndexedDB (misma base que la versión anterior, los datos se conservan) ----------
  const DB_NAME = 'inncosmetic-proveedores', STORE = 'proveedores';
  const dbp = new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE, { keyPath: 'id' });
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  async function run(mode, fn) {
    const db = await dbp;
    return new Promise((res, rej) => {
      const t = db.transaction(STORE, mode);
      const req = fn(t.objectStore(STORE));
      t.oncomplete = () => res(req && req.result);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error);
    });
  }
  const dbAll = () => run('readonly', s => s.getAll());
  const dbPut = item => run('readwrite', s => s.put(item));
  const dbDel = id => run('readwrite', s => s.delete(id));
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

  // ---------- Estado y utilidades ----------
  let items = [];
  const view = { q: '', tag: null };
  let editing = null, currentId = null;

  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
  const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
  const initials = n => (n || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
  const collator = new Intl.Collator('es', { sensitivity: 'base' });
  const X_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';
  const CAM_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';
  const PH_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="12" cy="12" r="3"/></svg>';

  const COUNTRIES = {
    'Alemania':'DE','Argentina':'AR','Australia':'AU','Austria':'AT','Bélgica':'BE','Bolivia':'BO','Brasil':'BR','Bulgaria':'BG',
    'Canadá':'CA','Chile':'CL','China':'CN','Colombia':'CO','Corea del Sur':'KR','Costa Rica':'CR','Croacia':'HR','Dinamarca':'DK',
    'Ecuador':'EC','Egipto':'EG','Emiratos Árabes Unidos':'AE','Eslovenia':'SI','España':'ES','Estados Unidos':'US','Filipinas':'PH',
    'Finlandia':'FI','Francia':'FR','Grecia':'GR','Guatemala':'GT','Hungría':'HU','India':'IN','Indonesia':'ID','Irlanda':'IE',
    'Israel':'IL','Italia':'IT','Japón':'JP','Malasia':'MY','Marruecos':'MA','México':'MX','Noruega':'NO','Nueva Zelanda':'NZ',
    'Países Bajos':'NL','Paraguay':'PY','Perú':'PE','Polonia':'PL','Portugal':'PT','Reino Unido':'GB','República Checa':'CZ',
    'Rumania':'RO','Singapur':'SG','Sudáfrica':'ZA','Suecia':'SE','Suiza':'CH','Tailandia':'TH','Taiwán':'TW','Turquía':'TR',
    'Ucrania':'UA','Uruguay':'UY','Venezuela':'VE','Vietnam':'VN'
  };
  const ALIASES = { 'eeuu':'US','usa':'US','ee.uu.':'US','holanda':'NL','uk':'GB','inglaterra':'GB','corea':'KR','uae':'AE','emiratos':'AE' };
  const COUNTRY_BY_NORM = Object.fromEntries(Object.entries(COUNTRIES).map(([n, c]) => [norm(n), c]));
  const flag = name => {
    const code = COUNTRY_BY_NORM[norm(name)] || ALIASES[norm(name)];
    return code ? String.fromCodePoint(...[...code].map(ch => 127397 + ch.charCodeAt(0))) + ' ' : '';
  };
  const countryLabel = p => p.country ? flag(p.country) + p.country : '';

  function toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200);
  }

  function compress(file, max = 1800, q = .84) {
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(file), img = new Image();
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q));
      };
      img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
      img.src = url;
    });
  }
  async function readPhotos(files) {
    const out = [];
    for (const f of files) {
      if (!f.type.startsWith('image/') && !/\.(heic|heif)$/i.test(f.name)) continue;
      try { out.push(await compress(f)); } catch { toast('Una foto no se pudo leer'); }
    }
    return out;
  }

  // ---------- Listado ----------
  function tagCounts() {
    const m = new Map();
    for (const p of items) for (const t of p.tags || []) {
      const k = norm(t); const e = m.get(k) || { label: t, n: 0 }; e.n++; m.set(k, e);
    }
    return [...m.values()].sort((a, b) => b.n - a.n || collator.compare(a.label, b.label));
  }

  function filtered() {
    const q = norm(view.q);
    return items
      .filter(p => !view.tag || (p.tags || []).some(t => norm(t) === norm(view.tag)))
      .filter(p => !q || norm([p.name, p.country, (p.tags || []).join(' '), p.notes].join(' ')).includes(q))
      .sort((a, b) => collator.compare(a.name, b.name));
  }

  function render() {
    const tags = tagCounts().slice(0, 14);
    if (view.tag && !tags.some(t => norm(t.label) === norm(view.tag))) view.tag = null;
    $('#filters').innerHTML = tags.length ? [`<button class="pill ${view.tag ? '' : 'on'}" data-tag="">Todos</button>`,
      ...tags.map(t => `<button class="pill ${norm(t.label) === norm(view.tag) ? 'on' : ''}" data-tag="${esc(t.label)}">${esc(t.label)}</button>`)].join('') : '';

    $('#lede').textContent = items.length
      ? `${items.length} ${items.length === 1 ? 'proveedor' : 'proveedores'} · ${tagCounts().length} activos`
      : 'Quién trabaja qué, con fotos.';
    $('#searchBox').classList.toggle('hidden', !items.length);

    const list = filtered();
    $('#grid').innerHTML = list.map(p => {
      const photos = p.photos || [], tags = p.tags || [];
      return `<button class="card" data-id="${p.id}">
        <div class="card-img">
          ${photos[0] ? `<img src="${photos[0]}" alt="" loading="lazy" />` : `<div class="initials">${esc(initials(p.name))}</div>`}
          ${photos.length > 1 ? `<span class="n">${PH_ICON}${photos.length}</span>` : ''}
        </div>
        <h3>${esc(p.name)}</h3>
        ${p.country ? `<p class="country">${esc(countryLabel(p))}</p>` : ''}
        <p class="${tags.length ? '' : 'none'}">${tags.length ? esc(tags.join(' · ')) : 'Sin activos cargados'}</p>
      </button>`;
    }).join('');

    const empty = $('#empty');
    empty.innerHTML = !items.length
      ? `<div class="empty-art">${CAM_ICON}</div><h2>Empezá por el primero.</h2><p>Sacale una foto, poné el nombre, el país y los activos que trabaja. Nada más.</p>`
      : `<h2>Sin resultados.</h2><p>Nada coincide con “${esc(view.q)}”.</p>`;
    empty.classList.toggle('hidden', list.length > 0);
  }

  // ---------- Detalle ----------
  function openDetail(id) {
    const p = items.find(x => x.id === id); if (!p) return;
    currentId = id;
    const photos = p.photos || [], tags = p.tags || [];
    const date = new Date(p.updatedAt || p.createdAt || Date.now()).toLocaleDateString('es-UY', { day: 'numeric', month: 'long', year: 'numeric' });
    $('#detail').innerHTML = `
      <div class="gallery-wrap">
        <div class="gallery" id="gallery">
          ${photos.length ? photos.map((s, i) => `<img src="${s}" data-i="${i}" alt="" />`).join('') : `<div class="initials" style="width:100%">${esc(initials(p.name))}</div>`}
        </div>
        ${photos.length > 1 ? `<div class="dots">${photos.map((_, i) => `<i class="${i ? '' : 'on'}"></i>`).join('')}</div>` : ''}
      </div>
      <div class="d-body">
        <h1>${esc(p.name)}</h1>
        ${p.country ? `<p class="d-country">${esc(countryLabel(p))}</p>` : ''}
        <p class="d-date">Actualizado el ${date}</p>
        <div class="d-sec"><h4>Activos que trabaja</h4>
          ${tags.length ? `<div class="d-tags">${tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>` : '<p class="muted">Todavía no cargaste activos.</p>'}
        </div>
        ${p.notes ? `<div class="d-sec"><h4>Notas</h4><p class="d-notes">${esc(p.notes)}</p></div>` : ''}
        <div class="d-sec"><h4>Fotos${photos.length ? ` · ${photos.length}` : ''}</h4>
          <div class="d-photos">
            ${photos.map((s, i) => `<img src="${s}" data-i="${i}" alt="" loading="lazy" />`).join('')}
            <button type="button" id="quickAdd">${CAM_ICON}Agregar</button>
          </div>
        </div>
      </div>`;
    const g = $('#gallery');
    g.addEventListener('scroll', () => {
      const i = Math.round(g.scrollLeft / g.clientWidth);
      document.querySelectorAll('.dots i').forEach((d, j) => d.classList.toggle('on', i === j));
    }, { passive: true });
    const sheet = $('#detailSheet');
    if (!sheet.open) sheet.showModal();
    $('#detail').scrollTop = 0;
  }

  $('#detail').onclick = e => {
    if (e.target.closest('#quickAdd')) return $('#quickPhoto').click();
    const img = e.target.closest('img[data-i]');
    if (img) { $('#lbImg').src = img.src; $('#lightbox').showModal(); }
  };
  $('#quickPhoto').onchange = async e => {
    const files = [...e.target.files]; e.target.value = '';
    const p = items.find(x => x.id === currentId); if (!p || !files.length) return;
    toast('Agregando fotos…');
    const added = await readPhotos(files); if (!added.length) return;
    const next = { ...p, photos: [...(p.photos || []), ...added], updatedAt: Date.now() };
    try { await dbPut(next); } catch { return toast('No hay espacio para guardar'); }
    items[items.indexOf(p)] = next; render(); openDetail(p.id);
    toast(added.length === 1 ? 'Foto agregada' : `${added.length} fotos agregadas`);
  };

  // ---------- Formulario ----------
  function openForm(p) {
    const isNew = !p;
    editing = structuredClone(p || { id: uid(), name: '', country: '', tags: [], notes: '', photos: [] });
    editing.tags = editing.tags || []; editing.photos = editing.photos || [];
    $('#formTitle').textContent = isNew ? 'Nuevo proveedor' : 'Editar';
    $('#deleteWrap').classList.toggle('hidden', isNew);
    $('#f-name').value = editing.name || '';
    $('#f-notes').value = editing.notes || '';
    $('#f-country').value = editing.country || '';
    $('#countryList').innerHTML = [...new Set([...items.map(x => x.country).filter(Boolean), ...Object.keys(COUNTRIES)])].map(c => `<option value="${esc(c)}">`).join('');
    $('#tagInput').value = '';
    $('#tagList').innerHTML = tagCounts().map(t => `<option value="${esc(t.label)}">`).join('');
    renderPhotos(); renderTags(); updateSave();
    const sheet = $('#formSheet');
    if (!sheet.open) sheet.showModal();
    sheet.querySelector('.scroll').scrollTop = 0;
  }

  function renderPhotos() {
    const ph = editing.photos;
    $('#photos').innerHTML = !ph.length
      ? `<button type="button" class="dropzone" id="drop"><span class="cam">${CAM_ICON}</span><b>Agregar fotos</b><small>Sacá una foto o elegila de la galería</small></button>`
      : `<div class="thumbs">${ph.map((s, i) => `
          <div class="thumb"><img src="${s}" alt="" />
            ${i ? `<button type="button" class="mk" data-cover="${i}" aria-label="Usar como portada"></button>` : '<span class="cover-tag">Portada</span>'}
            <button type="button" class="rm" data-rm="${i}" aria-label="Quitar foto">${X_ICON}</button>
          </div>`).join('')}
          <button type="button" class="thumb-add" id="drop">${CAM_ICON}Agregar</button>
        </div><p class="hint">Tocá una foto para hacerla portada.</p>`;
  }
  function renderTags() {
    const box = $('#tagBox'), input = $('#tagInput');
    box.querySelectorAll('.tag').forEach(t => t.remove());
    editing.tags.forEach((t, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'tag'; b.dataset.i = i; b.innerHTML = esc(t) + X_ICON;
      b.setAttribute('aria-label', `Quitar ${t}`);
      box.insertBefore(b, input);
    });
    input.placeholder = editing.tags.length ? 'Agregar otro' : 'Escribí un activo y tocá Enter';
  }
  function addTag(raw) {
    raw.split(/[,;\n]/).map(s => s.trim()).filter(Boolean).forEach(t => {
      if (!editing.tags.some(x => norm(x) === norm(t))) editing.tags.push(t);
    });
    renderTags();
  }
  function updateSave() { $('#saveBtn').disabled = !$('#f-name').value.trim(); }

  async function save() {
    const name = $('#f-name').value.trim();
    if (!name) return $('#f-name').focus();
    if ($('#tagInput').value.trim()) addTag($('#tagInput').value);
    editing.name = name;
    editing.notes = $('#f-notes').value.trim();
    editing.country = $('#f-country').value.trim();
    const now = Date.now();
    editing.createdAt = editing.createdAt || now; editing.updatedAt = now;
    try { await dbPut(editing); } catch { return toast('No hay espacio para guardar'); }
    const i = items.findIndex(x => x.id === editing.id);
    if (i >= 0) items[i] = editing; else items.push(editing);
    const id = editing.id, wasOpen = $('#detailSheet').open;
    $('#formSheet').close(); render(); toast('Guardado');
    if (wasOpen) openDetail(id);
  }

  async function addFormPhotos(files) {
    if (!files.length) return;
    toast(files.length > 1 ? `Procesando ${files.length} fotos…` : 'Procesando foto…');
    editing.photos.push(...await readPhotos(files)); renderPhotos();
  }

  // ---------- Copias ----------
  function download(name, content, type) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([content], { type })); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  const today = () => new Date().toISOString().slice(0, 10);
  function exportJSON() {
    if (!items.length) return toast('Todavía no hay proveedores');
    download(`proveedores-inncosmetic-${today()}.json`, JSON.stringify({ app: 'inncosmetic-proveedores', version: 2, exportedAt: new Date().toISOString(), items }), 'application/json');
    toast('Copia descargada');
  }
  function exportCSV() {
    if (!items.length) return toast('Todavía no hay proveedores');
    const cell = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const rows = [['Proveedor', 'País', 'Activos', 'Notas', 'Fotos'].map(cell).join(';'),
      ...filtered().map(p => [p.name, p.country, (p.tags || []).join(', '), p.notes, (p.photos || []).length].map(cell).join(';'))];
    download(`proveedores-inncosmetic-${today()}.csv`, '﻿' + rows.join('\r\n'), 'text/csv;charset=utf-8');
    toast('Planilla descargada');
  }
  async function importJSON(file) {
    try {
      const data = JSON.parse(await file.text());
      const list = Array.isArray(data) ? data : data.items;
      if (!Array.isArray(list)) throw 0;
      let n = 0;
      for (const p of list) {
        if (!p || typeof p.name !== 'string') continue;
        const item = { tags: [], photos: [], notes: '', ...p, id: p.id || uid() };
        await dbPut(item);
        const i = items.findIndex(x => x.id === item.id);
        if (i >= 0) items[i] = item; else items.push(item);
        n++;
      }
      render(); toast(`${n} ${n === 1 ? 'proveedor restaurado' : 'proveedores restaurados'}`);
    } catch { toast('Ese archivo no es una copia válida'); }
  }

  // ---------- Eventos ----------
  $('#addBtn').onclick = () => openForm();
  $('#q').oninput = e => { view.q = e.target.value; render(); };
  $('#filters').onclick = e => { const b = e.target.closest('[data-tag]'); if (b) { view.tag = b.dataset.tag || null; render(); } };
  $('#grid').onclick = e => { const c = e.target.closest('.card'); if (c) openDetail(c.dataset.id); };
  addEventListener('scroll', () => $('#nav').classList.toggle('scrolled', scrollY > 60), { passive: true });

  const menu = $('#menu');
  $('#menuBtn').onclick = e => { e.stopPropagation(); menu.classList.toggle('hidden'); };
  document.addEventListener('click', e => { if (!menu.contains(e.target)) menu.classList.add('hidden'); });
  menu.onclick = e => {
    const act = e.target.closest('[data-act]')?.dataset.act; if (!act) return;
    menu.classList.add('hidden');
    ({ export: exportJSON, csv: exportCSV, import: () => $('#importFile').click() })[act]();
  };
  $('#importFile').onchange = e => { const f = e.target.files[0]; if (f) importJSON(f); e.target.value = ''; };

  $('#cancelBtn').onclick = () => $('#formSheet').close();
  $('#saveBtn').onclick = save;
  $('#f-name').oninput = updateSave;
  $('#f-name').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); $('#f-country').focus(); } };
  $('#f-country').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); $('#tagInput').focus(); } };

  $('#photos').onclick = e => {
    if (e.target.closest('#drop')) return $('#photoInput').click();
    const rm = e.target.closest('[data-rm]'), cv = e.target.closest('[data-cover]');
    if (rm) { editing.photos.splice(+rm.dataset.rm, 1); renderPhotos(); }
    else if (cv) { const [p] = editing.photos.splice(+cv.dataset.cover, 1); editing.photos.unshift(p); renderPhotos(); }
  };
  $('#photoInput').onchange = e => { const f = [...e.target.files]; e.target.value = ''; addFormPhotos(f); };
  const form = $('#form');
  form.addEventListener('dragover', e => { e.preventDefault(); $('#drop')?.classList.add('over'); });
  form.addEventListener('dragleave', e => { if (!form.contains(e.relatedTarget)) $('#drop')?.classList.remove('over'); });
  form.addEventListener('drop', e => { e.preventDefault(); $('#drop')?.classList.remove('over'); addFormPhotos([...e.dataTransfer.files]); });

  $('#tagInput').onkeydown = e => {
    const v = e.target.value;
    if ((e.key === 'Enter' || e.key === ',') && v.trim()) { e.preventDefault(); addTag(v); e.target.value = ''; }
    else if (e.key === 'Enter') e.preventDefault();
    else if (e.key === 'Backspace' && !v && editing.tags.length) { editing.tags.pop(); renderTags(); }
  };
  $('#tagInput').oninput = e => { if (/[,;]/.test(e.target.value)) { addTag(e.target.value); e.target.value = ''; } };
  $('#tagBox').onclick = e => {
    const t = e.target.closest('.tag');
    if (t) { editing.tags.splice(+t.dataset.i, 1); renderTags(); }
    $('#tagInput').focus();
  };

  $('#deleteBtn').onclick = async () => {
    if (!confirm(`¿Eliminar “${editing.name}”? No se puede deshacer.`)) return;
    await dbDel(editing.id);
    items = items.filter(x => x.id !== editing.id);
    $('#formSheet').close(); $('#detailSheet').close(); render(); toast('Eliminado');
  };

  $('#closeDetail').onclick = () => $('#detailSheet').close();
  $('#editBtn').onclick = () => openForm(items.find(x => x.id === currentId));
  $('#lbClose').onclick = () => $('#lightbox').close();
  $('#lightbox').onclick = e => { if (e.target.id !== 'lbClose') $('#lightbox').close(); };
  for (const d of [$('#formSheet'), $('#detailSheet')]) {
    d.addEventListener('click', e => {
      if (e.target !== d) return;
      const r = d.getBoundingClientRect();
      if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) d.close();
    });
  }

  dbAll().then(list => { items = list || []; render(); })
    .catch(() => { render(); toast('Este navegador no permite guardar datos'); });
})();
</script>
</body>
</html>
