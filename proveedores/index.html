<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Proveedores" />
<meta name="theme-color" content="#000000" />
<meta name="color-scheme" content="dark" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="icon" type="image/png" href="icon-180.png" />
<title>Proveedores in-cosmetics</title>
<style>
  /* Paleta in-cosmetics (in-cosmetics.com), siempre en modo oscuro */
  :root {
    color-scheme: dark;
    --brand: #784A98;
    --brand-hi: #9A6BBF;
    --brand-text: #D4BCE8;
    --bg: #000;
    --ink: #FFFFFF;
    --ink-2: rgba(235,235,245,.62);
    --ink-3: rgba(235,235,245,.34);
    --line: rgba(255,255,255,.12);
    --field: rgba(255,255,255,.07);
    --danger: #FF453A;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
    --ease: cubic-bezier(.2,.9,.25,1);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; background: var(--bg); }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh; background: var(--bg); color: var(--ink);
    font-family: var(--font); font-size: 17px; line-height: 1.35; letter-spacing: -.012em;
    -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none;
  }
  input, textarea { -webkit-user-select: text; user-select: text; }
  button, input, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
  button { cursor: pointer; }
  img { display: block; -webkit-user-drag: none; }
  .hidden { display: none !important; }

  /* Luz ambiente violeta detrás del vidrio */
  .ambient { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
  .ambient::before, .ambient::after {
    content: ""; position: absolute; border-radius: 50%; filter: blur(80px);
  }
  .ambient::before { width: 70vmax; height: 70vmax; left: -25vmax; top: -30vmax; background: radial-gradient(circle, rgba(120,74,152,.55), transparent 65%); }
  .ambient::after { width: 60vmax; height: 60vmax; right: -25vmax; bottom: -25vmax; background: radial-gradient(circle, rgba(74,44,97,.6), transparent 65%); }

  /* ---------- Material Liquid Glass ---------- */
  .glass {
    position: relative;
    background: linear-gradient(145deg, rgba(255,255,255,.16), rgba(255,255,255,.05) 45%, rgba(255,255,255,.08));
    -webkit-backdrop-filter: blur(24px) saturate(190%); backdrop-filter: blur(24px) saturate(190%);
    border: .5px solid rgba(255,255,255,.22);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.32),
      inset 0 -1px 1px rgba(255,255,255,.06),
      inset 0 0 18px rgba(255,255,255,.04),
      0 10px 30px rgba(0,0,0,.45);
  }
  .glass.tint {
    background: linear-gradient(145deg, rgba(170,120,210,.75), rgba(120,74,152,.62) 50%, rgba(90,52,120,.7));
    border-color: rgba(220,190,245,.4);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.45), inset 0 -1px 1px rgba(255,255,255,.1), 0 10px 30px rgba(120,74,152,.45);
  }
  .press { transition: transform .35s var(--ease), filter .2s; }
  .press:active { transform: scale(.93); filter: brightness(1.25); }

  /* ---------- Barra superior con borde difuminado ---------- */
  .top {
    position: sticky; top: 0; z-index: 20; padding: calc(env(safe-area-inset-top) + 10px) 20px 14px;
  }
  .top::before {
    content: ""; position: absolute; inset: 0 0 -24px; z-index: -1; opacity: 0; transition: opacity .3s;
    background: linear-gradient(to bottom, rgba(0,0,0,.75), rgba(0,0,0,.35) 70%, transparent);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    -webkit-mask-image: linear-gradient(to bottom, #000 55%, transparent); mask-image: linear-gradient(to bottom, #000 55%, transparent);
  }
  .top.scrolled::before { opacity: 1; }
  .top-inner { max-width: 1120px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .logo { height: 22px; width: auto; transition: opacity .2s; }
  .top-title { position: absolute; left: 50%; transform: translate(-50%, 6px); font-size: 17px; font-weight: 600; opacity: 0; transition: all .3s var(--ease); pointer-events: none; }
  .top.scrolled .top-title { opacity: 1; transform: translate(-50%, 0); }
  .top.scrolled .logo { opacity: 0; }
  .circle {
    width: 44px; height: 44px; border-radius: 50%; border: none; display: grid; place-items: center; color: var(--ink); flex: none;
  }
  .circle svg { width: 20px; height: 20px; }

  main { max-width: 1120px; margin: 0 auto; padding: 4px 20px calc(env(safe-area-inset-bottom) + 120px); }
  .large { font-size: 34px; font-weight: 700; letter-spacing: -.03em; margin: 8px 0 2px; line-height: 1.1; }
  .sub { color: var(--ink-2); font-size: 15px; margin: 0; }

  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 18px 20px 6px; margin: 0 -20px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { border: none; height: 36px; padding: 0 16px; border-radius: 999px; font-size: 15px; font-weight: 500; white-space: nowrap; color: var(--ink); flex: none; }

  /* ---------- Tarjetas ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(240px, 100%), 1fr)); gap: 14px; margin-top: 18px; }
  @media (max-width: 560px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; } }
  .card {
    position: relative; border: none; padding: 0; aspect-ratio: 3 / 4; border-radius: 28px; overflow: hidden; text-align: left;
    background: #111; min-width: 0; box-shadow: 0 0 0 .5px rgba(255,255,255,.1), 0 12px 32px rgba(0,0,0,.5);
    transition: transform .4s var(--ease);
  }
  .card:active { transform: scale(.965); }
  .card > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .card .initials { position: absolute; inset: 0; }
  .initials {
    display: grid; place-items: center; color: rgba(255,255,255,.9); font-size: 46px; font-weight: 700; letter-spacing: -.03em;
    background: radial-gradient(circle at 30% 20%, rgba(255,255,255,.22), transparent 55%), linear-gradient(160deg, #9A6BBF, #784A98 50%, #3E2452);
  }
  .card .info {
    position: absolute; left: 8px; right: 8px; bottom: 8px; border-radius: 21px; padding: 11px 13px 12px;
    background: linear-gradient(145deg, rgba(40,40,44,.42), rgba(20,20,24,.3));
  }
  .card h3 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -.02em; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .meta { margin: 3px 0 0; font-size: 12.5px; color: rgba(255,255,255,.78); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .meta.dim { color: rgba(255,255,255,.5); }
  .count {
    position: absolute; top: 10px; right: 10px; height: 28px; padding: 0 10px; border-radius: 999px;
    display: flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600;
  }
  .count svg { width: 13px; height: 13px; }

  .empty { text-align: center; padding: 70px 24px 20px; }
  .empty-icon { width: 92px; height: 92px; border-radius: 28px; margin: 0 auto 22px; display: grid; place-items: center; }
  .empty-icon svg { width: 42px; height: 42px; }
  .empty h2 { font-size: 24px; letter-spacing: -.02em; margin: 0 0 8px; }
  .empty p { color: var(--ink-2); margin: 0 auto; max-width: 320px; font-size: 16px; }

  /* ---------- Barra inferior flotante (estilo iOS 26) ---------- */
  .dock {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; pointer-events: none;
    padding: 0 16px calc(env(safe-area-inset-bottom) + 10px);
  }
  .dock::before {
    content: ""; position: absolute; inset: -30px 0 0; z-index: -1;
    background: linear-gradient(to top, rgba(0,0,0,.7), transparent);
  }
  .dock-inner { max-width: 640px; margin: 0 auto; display: flex; gap: 10px; align-items: center; pointer-events: auto; }
  @media (min-width: 900px) { .dock { padding-bottom: 20px; } }
  .search { flex: 1; height: 52px; border-radius: 999px; display: flex; align-items: center; gap: 9px; padding: 0 18px; min-width: 0; }
  .search svg { width: 18px; height: 18px; color: var(--ink-2); flex: none; }
  .search input { flex: 1; min-width: 0; border: none; background: none; outline: none; font-size: 17px; }
  .search input::placeholder { color: var(--ink-2); }
  .add { width: 52px; height: 52px; }
  .add svg { width: 24px; height: 24px; }

  /* ---------- Hojas ---------- */
  dialog {
    border: none; padding: 0; color: var(--ink); overflow: hidden; flex-direction: column;
    width: calc(100% - 16px); max-width: 620px;
    height: calc(100% - env(safe-area-inset-top) - 18px); max-height: none;
    margin: calc(env(safe-area-inset-top) + 10px) auto 8px; border-radius: 36px;
    background: linear-gradient(160deg, rgba(58,58,64,.72), rgba(28,28,32,.82));
    -webkit-backdrop-filter: blur(40px) saturate(180%); backdrop-filter: blur(40px) saturate(180%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 0 0 .5px rgba(255,255,255,.14), 0 30px 80px rgba(0,0,0,.7);
  }
  dialog[open] { display: flex; animation: up .5s var(--ease); }
  dialog::backdrop { background: rgba(0,0,0,.45); animation: fade .3s ease; }
  @keyframes up { from { transform: translateY(105%); } }
  @keyframes fade { from { opacity: 0; } }
  @keyframes pop { from { transform: scale(.9); opacity: 0; } }
  @media (min-width: 720px) {
    dialog { height: auto; max-height: 88vh; margin: auto; }
    dialog[open] { animation: pop .35s var(--ease); }
  }
  .sheet-head { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px; padding: 14px 14px 8px; flex: none; }
  .sheet-head h2 { margin: 0; text-align: center; font-size: 17px; font-weight: 600; }
  .sheet-head .circle:disabled { opacity: .35; filter: saturate(0); }
  .scroll { overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }

  /* ---------- Formulario ---------- */
  .form { padding: 8px 18px calc(env(safe-area-inset-bottom) + 28px); }
  .dropzone {
    width: 100%; aspect-ratio: 4 / 3; border-radius: 26px; border: 1.5px dashed rgba(255,255,255,.22); background: rgba(255,255,255,.04);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--ink-2);
  }
  .dropzone.over { border-color: var(--brand-hi); background: rgba(120,74,152,.18); }
  .dropzone .cam { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; color: #fff; }
  .dropzone .cam svg { width: 28px; height: 28px; }
  .dropzone b { color: var(--ink); font-size: 17px; font-weight: 600; }
  .dropzone small { font-size: 14px; }
  .thumbs { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; margin: 0 -18px; padding: 0 18px 2px; }
  .thumbs::-webkit-scrollbar { display: none; }
  .thumb { position: relative; flex: none; width: 124px; aspect-ratio: 3 / 4; border-radius: 20px; overflow: hidden; background: #111; }
  .thumb:first-child { width: 160px; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .thumb .rm { position: absolute; top: 7px; right: 7px; width: 28px; height: 28px; border-radius: 50%; border: none; display: grid; place-items: center; color: #fff; }
  .thumb .rm svg { width: 11px; height: 11px; }
  .thumb .cover-tag { position: absolute; left: 7px; bottom: 7px; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; }
  .thumb .mk { position: absolute; inset: 0; border: none; background: none; }
  .thumb-add {
    flex: none; width: 124px; aspect-ratio: 3 / 4; border-radius: 20px; border: 1.5px dashed rgba(255,255,255,.22); background: rgba(255,255,255,.03);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: var(--brand-text); font-size: 14px; font-weight: 500;
  }
  .thumb-add svg { width: 26px; height: 26px; }
  .hint { font-size: 13px; color: var(--ink-3); margin: 10px 4px 0; }

  .field { margin-top: 22px; }
  .field > label { display: block; font-size: 13px; font-weight: 500; color: var(--ink-2); margin: 0 6px 8px; }
  .field > label i { font-style: normal; color: var(--ink-3); }
  .input, .tagbox {
    width: 100%; border: .5px solid rgba(255,255,255,.1); background: var(--field); border-radius: 18px;
    box-shadow: inset 0 1px 2px rgba(0,0,0,.25);
    transition: border-color .2s, background .2s;
  }
  .input { padding: 15px 16px; font-size: 17px; outline: none; }
  .input:focus, .tagbox:focus-within { border-color: rgba(190,150,225,.6); background: rgba(255,255,255,.1); }
  .input.name { font-size: 22px; font-weight: 600; letter-spacing: -.02em; }
  .input::placeholder, .tagbox input::placeholder { color: var(--ink-3); font-weight: 400; }
  textarea.input { resize: vertical; min-height: 120px; line-height: 1.45; }
  .tagbox { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; min-height: 54px; cursor: text; }
  .tagbox input { flex: 1; min-width: 150px; border: none; background: none; outline: none; font-size: 17px; padding: 4px; }
  .tag {
    display: inline-flex; align-items: center; gap: 7px; font-size: 15px; font-weight: 500; color: #F1E6FA;
    padding: 7px 13px; border-radius: 999px; border: .5px solid rgba(210,175,240,.35);
    background: linear-gradient(145deg, rgba(154,107,191,.45), rgba(120,74,152,.3));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.2);
  }
  .tag svg { width: 9px; height: 9px; opacity: .75; }
  .danger { width: 100%; height: 52px; border-radius: 999px; border: none; color: var(--danger); font-size: 17px; font-weight: 600; margin-top: 8px; }

  /* ---------- Detalle ---------- */
  #detailSheet { background: linear-gradient(180deg, rgba(28,28,32,.92), rgba(18,18,22,.96)); }
  .d-head { position: absolute; top: 0; left: 0; right: 0; z-index: 3; display: flex; justify-content: space-between; padding: 14px; pointer-events: none; }
  .d-head > * { pointer-events: auto; }
  .pill-btn { height: 44px; padding: 0 18px; border-radius: 999px; border: none; font-size: 16px; font-weight: 600; color: #fff; }
  .hero { position: relative; }
  .gallery { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; aspect-ratio: 4 / 5; max-height: 62vh; width: 100%; background: #111; }
  .gallery::-webkit-scrollbar { display: none; }
  .gallery img { flex: none; width: 100%; height: 100%; object-fit: cover; scroll-snap-align: center; cursor: zoom-in; }
  .gallery .initials { flex: none; width: 100%; font-size: 76px; }
  .hero::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 40%; background: linear-gradient(to top, rgba(24,24,28,1), transparent); pointer-events: none; }
  .dots { position: absolute; bottom: 92px; left: 50%; transform: translateX(-50%); z-index: 2; display: flex; gap: 6px; padding: 7px 10px; border-radius: 999px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.4); transition: all .25s; }
  .dots i.on { background: #fff; width: 18px; border-radius: 4px; }
  .d-title { position: relative; z-index: 2; margin-top: -72px; padding: 0 20px; }
  .d-title h1 { margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -.03em; line-height: 1.08; text-shadow: 0 2px 16px rgba(0,0,0,.5); }
  .d-country { margin: 6px 0 0; font-size: 17px; color: rgba(255,255,255,.85); }
  .d-body { padding: 18px 16px calc(env(safe-area-inset-bottom) + 30px); }
  .panel { border-radius: 26px; padding: 16px; margin-top: 12px; background: rgba(255,255,255,.06); border: .5px solid rgba(255,255,255,.08); }
  .panel h4 { margin: 0 0 12px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
  .d-tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .d-notes { font-size: 17px; white-space: pre-wrap; word-break: break-word; margin: 0; line-height: 1.5; color: rgba(255,255,255,.92); -webkit-user-select: text; user-select: text; }
  .d-photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .d-photos img, .d-photos button { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 14px; }
  .d-photos img { cursor: zoom-in; }
  .d-photos button {
    border: 1.5px dashed rgba(255,255,255,.2); background: rgba(255,255,255,.03); color: var(--brand-text);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 13px; font-weight: 500;
  }
  .d-photos button svg { width: 24px; height: 24px; }
  .muted { color: var(--ink-3); margin: 0; }
  .d-date { color: var(--ink-3); font-size: 13px; text-align: center; margin: 22px 0 0; }

  #lightbox { background: #000; width: 100vw; max-width: none; height: 100vh; height: 100dvh; margin: 0; border-radius: 0; -webkit-backdrop-filter: none; backdrop-filter: none; box-shadow: none; }
  #lightbox img { width: 100%; height: 100%; object-fit: contain; }
  #lightbox .circle { position: absolute; top: calc(env(safe-area-inset-top) + 12px); right: 14px; }

  /* ---------- Menú y aviso ---------- */
  .menu {
    position: fixed; z-index: 40; right: 16px; top: calc(env(safe-area-inset-top) + 64px); width: 250px; border-radius: 22px; overflow: hidden;
    background: linear-gradient(160deg, rgba(70,70,76,.72), rgba(36,36,40,.8)); animation: pop .22s var(--ease); transform-origin: top right;
  }
  .menu button { display: flex; align-items: center; justify-content: space-between; width: 100%; border: none; background: none; padding: 14px 18px; font-size: 16px; text-align: left; }
  .menu button + button { border-top: .5px solid var(--line); }
  .menu button:active { background: rgba(255,255,255,.08); }
  .menu svg { width: 18px; height: 18px; color: var(--ink-2); }
  .toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 80px); z-index: 60;
    padding: 12px 20px; border-radius: 999px; font-size: 15px; font-weight: 600; white-space: nowrap;
    opacity: 0; transform: translate(-50%, 14px) scale(.95); transition: all .35s var(--ease); pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }

  @media (min-width: 720px) { .grid { gap: 20px; } .large { font-size: 44px; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, ::backdrop { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="ambient"></div>

<header class="top" id="top">
  <div class="top-inner">
    <img class="logo" src="logo.png" alt="in-cosmetics" />
    <div class="top-title">Proveedores</div>
    <button class="circle glass press" id="menuBtn" aria-label="Más opciones">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></svg>
    </button>
  </div>
</header>

<div class="menu glass hidden" id="menu">
  <button data-act="export">Descargar copia
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 10l5 5 5-5M5 21h14"/></svg></button>
  <button data-act="import">Restaurar copia
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5M5 21h14"/></svg></button>
  <button data-act="csv">Exportar a Excel
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></button>
</div>
<input type="file" id="importFile" accept="application/json,.json" hidden />

<main>
  <h1 class="large">Proveedores</h1>
  <p class="sub" id="lede">Quién trabaja qué, con fotos.</p>
  <div class="chips" id="chips"></div>
  <section class="grid" id="grid"></section>
  <div class="empty hidden" id="empty"></div>
</main>

<nav class="dock">
  <div class="dock-inner">
    <label class="search glass" id="searchBox">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Buscar" autocomplete="off" enterkeyhint="search" />
    </label>
    <button class="circle add glass tint press" id="addBtn" aria-label="Nuevo proveedor">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>
</nav>

<!-- Formulario -->
<dialog id="formSheet">
  <div class="sheet-head">
    <button class="circle glass press" id="cancelBtn" type="button" aria-label="Cancelar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <h2 id="formTitle">Nuevo proveedor</h2>
    <button class="circle glass tint press" id="saveBtn" type="button" aria-label="Guardar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>
    </button>
  </div>
  <div class="scroll">
    <form class="form" id="form" autocomplete="off" onsubmit="return false">
      <div id="photos"></div>
      <input type="file" id="photoInput" accept="image/*" multiple hidden />

      <div class="field">
        <label for="f-name">Nombre del proveedor</label>
        <input class="input name" id="f-name" placeholder="Ej: Química Oriental" />
      </div>

      <div class="field">
        <label for="f-country">País</label>
        <input class="input" id="f-country" list="countryList" placeholder="Ej: Francia" autocomplete="off" />
        <datalist id="countryList"></datalist>
      </div>

      <div class="field">
        <label for="tagInput">Activos que trabaja</label>
        <div class="tagbox" id="tagBox">
          <input id="tagInput" list="tagList" placeholder="Escribí un activo y tocá Enter" enterkeyhint="done" />
        </div>
        <datalist id="tagList"></datalist>
      </div>

      <div class="field">
        <label for="f-notes">Notas <i>· opcional</i></label>
        <textarea class="input" id="f-notes" placeholder="Precios, contacto, stand, lo que quieras recordar…"></textarea>
      </div>

      <div class="field hidden" id="deleteWrap">
        <button type="button" class="danger glass press" id="deleteBtn">Eliminar proveedor</button>
      </div>
    </form>
  </div>
</dialog>

<!-- Detalle -->
<dialog id="detailSheet">
  <div class="d-head">
    <button class="circle glass press" id="closeDetail" aria-label="Cerrar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <button class="pill-btn glass press" id="editBtn">Editar</button>
  </div>
  <div class="scroll" id="detail"></div>
</dialog>
<input type="file" id="quickPhoto" accept="image/*" multiple hidden />

<dialog id="lightbox">
  <img id="lbImg" alt="" />
  <button class="circle glass press" id="lbClose" aria-label="Cerrar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
  </button>
</dialog>

<div class="toast glass" id="toast"></div>

<script>
(() => {
  // ---------- IndexedDB (misma base de siempre, los datos se conservan) ----------
  const DB_NAME = 'inncosmetic-proveedores', STORE = 'proveedores';
  const dbp = new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE, { keyPath: 'id' });
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  async function run(mode, fn) {
    const db = await dbp;
    return new Promise((res, rej) => {
      const t = db.transaction(STORE, mode);
      const req = fn(t.objectStore(STORE));
      t.oncomplete = () => res(req && req.result);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error);
    });
  }
  const dbAll = () => run('readonly', s => s.getAll());
  const dbPut = item => run('readwrite', s => s.put(item));
  const dbDel = id => run('readwrite', s => s.delete(id));
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

  // ---------- Estado y utilidades ----------
  let items = [];
  const view = { q: '', tag: null };
  let editing = null, currentId = null;

  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
  const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
  const initials = n => (n || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
  const collator = new Intl.Collator('es', { sensitivity: 'base' });
  const X_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';
  const CAM_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';
  const PH_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="12" cy="12" r="3"/></svg>';

  const COUNTRIES = {
    'Alemania':'DE','Argentina':'AR','Australia':'AU','Austria':'AT','Bélgica':'BE','Bolivia':'BO','Brasil':'BR','Bulgaria':'BG',
    'Canadá':'CA','Chile':'CL','China':'CN','Colombia':'CO','Corea del Sur':'KR','Costa Rica':'CR','Croacia':'HR','Dinamarca':'DK',
    'Ecuador':'EC','Egipto':'EG','Emiratos Árabes Unidos':'AE','Eslovenia':'SI','España':'ES','Estados Unidos':'US','Filipinas':'PH',
    'Finlandia':'FI','Francia':'FR','Grecia':'GR','Guatemala':'GT','Hungría':'HU','India':'IN','Indonesia':'ID','Irlanda':'IE',
    'Israel':'IL','Italia':'IT','Japón':'JP','Malasia':'MY','Marruecos':'MA','México':'MX','Noruega':'NO','Nueva Zelanda':'NZ',
    'Países Bajos':'NL','Paraguay':'PY','Perú':'PE','Polonia':'PL','Portugal':'PT','Reino Unido':'GB','República Checa':'CZ',
    'Rumania':'RO','Singapur':'SG','Sudáfrica':'ZA','Suecia':'SE','Suiza':'CH','Tailandia':'TH','Taiwán':'TW','Turquía':'TR',
    'Ucrania':'UA','Uruguay':'UY','Venezuela':'VE','Vietnam':'VN'
  };
  const ALIASES = { 'eeuu':'US','usa':'US','ee.uu.':'US','holanda':'NL','uk':'GB','inglaterra':'GB','corea':'KR','uae':'AE','emiratos':'AE' };
  const COUNTRY_BY_NORM = Object.fromEntries(Object.entries(COUNTRIES).map(([n, c]) => [norm(n), c]));
  const flag = name => {
    const code = COUNTRY_BY_NORM[norm(name)] || ALIASES[norm(name)];
    return code ? String.fromCodePoint(...[...code].map(ch => 127397 + ch.charCodeAt(0))) + ' ' : '';
  };
  const countryLabel = p => p.country ? flag(p.country) + p.country : '';

  function toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200);
  }

  function compress(file, max = 1800, q = .84) {
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(file), img = new Image();
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q));
      };
      img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
      img.src = url;
    });
  }
  async function readPhotos(files) {
    const out = [];
    for (const f of files) {
      if (!f.type.startsWith('image/') && !/\.(heic|heif)$/i.test(f.name)) continue;
      try { out.push(await compress(f)); } catch { toast('Una foto no se pudo leer'); }
    }
    return out;
  }

  // ---------- Listado ----------
  function tagCounts() {
    const m = new Map();
    for (const p of items) for (const t of p.tags || []) {
      const k = norm(t); const e = m.get(k) || { label: t, n: 0 }; e.n++; m.set(k, e);
    }
    return [...m.values()].sort((a, b) => b.n - a.n || collator.compare(a.label, b.label));
  }

  function filtered() {
    const q = norm(view.q);
    return items
      .filter(p => !view.tag || (p.tags || []).some(t => norm(t) === norm(view.tag)))
      .filter(p => !q || norm([p.name, p.country, (p.tags || []).join(' '), p.notes].join(' ')).includes(q))
      .sort((a, b) => collator.compare(a.name, b.name));
  }

  function render() {
    const all = tagCounts(), tags = all.slice(0, 14);
    if (view.tag && !tags.some(t => norm(t.label) === norm(view.tag))) view.tag = null;
    $('#chips').innerHTML = tags.length ? [`<button class="chip glass press ${view.tag ? '' : 'tint'}" data-tag="">Todos</button>`,
      ...tags.map(t => `<button class="chip glass press ${norm(t.label) === norm(view.tag) ? 'tint' : ''}" data-tag="${esc(t.label)}">${esc(t.label)}</button>`)].join('') : '';
    $('#chips').classList.toggle('hidden', !tags.length);

    $('#lede').textContent = items.length
      ? `${items.length} ${items.length === 1 ? 'proveedor' : 'proveedores'} · ${all.length} ${all.length === 1 ? 'activo' : 'activos'}`
      : 'Quién trabaja qué, con fotos.';

    const list = filtered();
    $('#grid').innerHTML = list.map(p => {
      const photos = p.photos || [], tags = p.tags || [];
      const line = [countryLabel(p), tags.join(', ')].filter(Boolean).join(' · ');
      return `<button class="card" data-id="${p.id}">
        ${photos[0] ? `<img src="${photos[0]}" alt="" loading="lazy" />` : `<div class="initials">${esc(initials(p.name))}</div>`}
        ${photos.length > 1 ? `<span class="count glass">${PH_ICON}${photos.length}</span>` : ''}
        <div class="info glass">
          <h3>${esc(p.name)}</h3>
          <p class="meta ${line ? '' : 'dim'}">${line ? esc(line) : 'Sin activos cargados'}</p>
        </div>
      </button>`;
    }).join('');

    const empty = $('#empty');
    empty.innerHTML = !items.length
      ? `<div class="empty-icon glass tint">${CAM_ICON}</div><h2>Empezá por el primero</h2><p>Sacale una foto, poné el nombre, el país y los activos que trabaja. Tocá <b>+</b> abajo.</p>`
      : `<h2>Sin resultados</h2><p>Nada coincide con “${esc(view.q)}”.</p>`;
    empty.classList.toggle('hidden', list.length > 0);
  }

  // ---------- Detalle ----------
  function openDetail(id) {
    const p = items.find(x => x.id === id); if (!p) return;
    currentId = id;
    const photos = p.photos || [], tags = p.tags || [];
    const date = new Date(p.updatedAt || p.createdAt || Date.now()).toLocaleDateString('es-UY', { day: 'numeric', month: 'long', year: 'numeric' });
    $('#detail').innerHTML = `
      <div class="hero">
        <div class="gallery" id="gallery">
          ${photos.length ? photos.map((s, i) => `<img src="${s}" data-i="${i}" alt="" />`).join('') : `<div class="initials">${esc(initials(p.name))}</div>`}
        </div>
        ${photos.length > 1 ? `<div class="dots glass">${photos.map((_, i) => `<i class="${i ? '' : 'on'}"></i>`).join('')}</div>` : ''}
      </div>
      <div class="d-title">
        <h1>${esc(p.name)}</h1>
        ${p.country ? `<p class="d-country">${esc(countryLabel(p))}</p>` : ''}
      </div>
      <div class="d-body">
        <div class="panel"><h4>Activos que trabaja</h4>
          ${tags.length ? `<div class="d-tags">${tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>` : '<p class="muted">Todavía no cargaste activos.</p>'}
        </div>
        ${p.notes ? `<div class="panel"><h4>Notas</h4><p class="d-notes">${esc(p.notes)}</p></div>` : ''}
        <div class="panel"><h4>Fotos${photos.length ? ` · ${photos.length}` : ''}</h4>
          <div class="d-photos">
            ${photos.map((s, i) => `<img src="${s}" data-i="${i}" alt="" loading="lazy" />`).join('')}
            <button type="button" id="quickAdd" class="press">${CAM_ICON}Agregar</button>
          </div>
        </div>
        <p class="d-date">Actualizado el ${date}</p>
      </div>`;
    const g = $('#gallery');
    g.addEventListener('scroll', () => {
      const i = Math.round(g.scrollLeft / g.clientWidth);
      document.querySelectorAll('.dots i').forEach((d, j) => d.classList.toggle('on', i === j));
    }, { passive: true });
    const sheet = $('#detailSheet');
    if (!sheet.open) sheet.showModal();
    $('#detail').scrollTop = 0;
  }

  $('#detail').onclick = e => {
    if (e.target.closest('#quickAdd')) return $('#quickPhoto').click();
    const img = e.target.closest('img[data-i]');
    if (img) { $('#lbImg').src = img.src; $('#lightbox').showModal(); }
  };
  $('#quickPhoto').onchange = async e => {
    const files = [...e.target.files]; e.target.value = '';
    const p = items.find(x => x.id === currentId); if (!p || !files.length) return;
    toast('Agregando fotos…');
    const added = await readPhotos(files); if (!added.length) return;
    const next = { ...p, photos: [...(p.photos || []), ...added], updatedAt: Date.now() };
    try { await dbPut(next); } catch { return toast('No hay espacio para guardar'); }
    items[items.indexOf(p)] = next; render(); openDetail(p.id);
    toast(added.length === 1 ? 'Foto agregada' : `${added.length} fotos agregadas`);
  };

  // ---------- Formulario ----------
  function openForm(p) {
    const isNew = !p;
    editing = structuredClone(p || { id: uid(), name: '', country: '', tags: [], notes: '', photos: [] });
    editing.tags = editing.tags || []; editing.photos = editing.photos || [];
    $('#formTitle').textContent = isNew ? 'Nuevo proveedor' : 'Editar';
    $('#deleteWrap').classList.toggle('hidden', isNew);
    $('#f-name').value = editing.name || '';
    $('#f-country').value = editing.country || '';
    $('#f-notes').value = editing.notes || '';
    $('#tagInput').value = '';
    $('#tagList').innerHTML = tagCounts().map(t => `<option value="${esc(t.label)}">`).join('');
    $('#countryList').innerHTML = [...new Set([...items.map(x => x.country).filter(Boolean), ...Object.keys(COUNTRIES)])].map(c => `<option value="${esc(c)}">`).join('');
    renderPhotos(); renderTags(); updateSave();
    const sheet = $('#formSheet');
    if (!sheet.open) sheet.showModal();
    sheet.querySelector('.scroll').scrollTop = 0;
  }

  function renderPhotos() {
    const ph = editing.photos;
    $('#photos').innerHTML = !ph.length
      ? `<button type="button" class="dropzone press" id="drop"><span class="cam glass tint">${CAM_ICON}</span><b>Agregar fotos</b><small>Sacá una foto o elegila de la galería</small></button>`
      : `<div class="thumbs">${ph.map((s, i) => `
          <div class="thumb"><img src="${s}" alt="" />
            ${i ? `<button type="button" class="mk" data-cover="${i}" aria-label="Usar como portada"></button>` : '<span class="cover-tag glass">Portada</span>'}
            <button type="button" class="rm glass" data-rm="${i}" aria-label="Quitar foto">${X_ICON}</button>
          </div>`).join('')}
          <button type="button" class="thumb-add press" id="drop">${CAM_ICON}Agregar</button>
        </div><p class="hint">Tocá una foto para hacerla portada.</p>`;
  }
  function renderTags() {
    const box = $('#tagBox'), input = $('#tagInput');
    box.querySelectorAll('.tag').forEach(t => t.remove());
    editing.tags.forEach((t, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'tag'; b.dataset.i = i; b.innerHTML = esc(t) + X_ICON;
      b.setAttribute('aria-label', `Quitar ${t}`);
      box.insertBefore(b, input);
    });
    input.placeholder = editing.tags.length ? 'Agregar otro' : 'Escribí un activo y tocá Enter';
  }
  function addTag(raw) {
    raw.split(/[,;\n]/).map(s => s.trim()).filter(Boolean).forEach(t => {
      if (!editing.tags.some(x => norm(x) === norm(t))) editing.tags.push(t);
    });
    renderTags();
  }
  function updateSave() { $('#saveBtn').disabled = !$('#f-name').value.trim(); }

  async function save() {
    const name = $('#f-name').value.trim();
    if (!name) return $('#f-name').focus();
    if ($('#tagInput').value.trim()) addTag($('#tagInput').value);
    editing.name = name;
    editing.country = $('#f-country').value.trim();
    editing.notes = $('#f-notes').value.trim();
    const now = Date.now();
    editing.createdAt = editing.createdAt || now; editing.updatedAt = now;
    try { await dbPut(editing); } catch { return toast('No hay espacio para guardar'); }
    const i = items.findIndex(x => x.id === editing.id);
    if (i >= 0) items[i] = editing; else items.push(editing);
    const id = editing.id, wasOpen = $('#detailSheet').open;
    $('#formSheet').close(); render(); toast('Guardado');
    if (wasOpen) openDetail(id);
  }

  async function addFormPhotos(files) {
    if (!files.length) return;
    toast(files.length > 1 ? `Procesando ${files.length} fotos…` : 'Procesando foto…');
    editing.photos.push(...await readPhotos(files)); renderPhotos();
  }

  // ---------- Copias ----------
  function download(name, content, type) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([content], { type })); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  const today = () => new Date().toISOString().slice(0, 10);
  function exportJSON() {
    if (!items.length) return toast('Todavía no hay proveedores');
    download(`proveedores-${today()}.json`, JSON.stringify({ app: 'inncosmetic-proveedores', version: 3, exportedAt: new Date().toISOString(), items }), 'application/json');
    toast('Copia descargada');
  }
  function exportCSV() {
    if (!items.length) return toast('Todavía no hay proveedores');
    const cell = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const rows = [['Proveedor', 'País', 'Activos', 'Notas', 'Fotos'].map(cell).join(';'),
      ...filtered().map(p => [p.name, p.country, (p.tags || []).join(', '), p.notes, (p.photos || []).length].map(cell).join(';'))];
    download(`proveedores-${today()}.csv`, '﻿' + rows.join('\r\n'), 'text/csv;charset=utf-8');
    toast('Planilla descargada');
  }
  async function importJSON(file) {
    try {
      const data = JSON.parse(await file.text());
      const list = Array.isArray(data) ? data : data.items;
      if (!Array.isArray(list)) throw 0;
      let n = 0;
      for (const p of list) {
        if (!p || typeof p.name !== 'string') continue;
        const item = { tags: [], photos: [], notes: '', country: '', ...p, id: p.id || uid() };
        await dbPut(item);
        const i = items.findIndex(x => x.id === item.id);
        if (i >= 0) items[i] = item; else items.push(item);
        n++;
      }
      render(); toast(`${n} ${n === 1 ? 'proveedor restaurado' : 'proveedores restaurados'}`);
    } catch { toast('Ese archivo no es una copia válida'); }
  }

  // ---------- Eventos ----------
  $('#addBtn').onclick = () => openForm();
  $('#q').oninput = e => { view.q = e.target.value; render(); };
  $('#q').onkeydown = e => { if (e.key === 'Enter') e.target.blur(); };
  $('#chips').onclick = e => { const b = e.target.closest('[data-tag]'); if (b) { view.tag = b.dataset.tag || null; render(); } };
  $('#grid').onclick = e => { const c = e.target.closest('.card'); if (c) openDetail(c.dataset.id); };
  addEventListener('scroll', () => $('#top').classList.toggle('scrolled', scrollY > 40), { passive: true });

  const menu = $('#menu');
  $('#menuBtn').onclick = e => { e.stopPropagation(); menu.classList.toggle('hidden'); };
  document.addEventListener('click', e => { if (!menu.contains(e.target)) menu.classList.add('hidden'); });
  menu.onclick = e => {
    const act = e.target.closest('[data-act]')?.dataset.act; if (!act) return;
    menu.classList.add('hidden');
    ({ export: exportJSON, csv: exportCSV, import: () => $('#importFile').click() })[act]();
  };
  $('#importFile').onchange = e => { const f = e.target.files[0]; if (f) importJSON(f); e.target.value = ''; };

  $('#cancelBtn').onclick = () => $('#formSheet').close();
  $('#saveBtn').onclick = save;
  $('#f-name').oninput = updateSave;
  $('#f-name').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); $('#f-country').focus(); } };
  $('#f-country').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); $('#tagInput').focus(); } };

  $('#photos').onclick = e => {
    if (e.target.closest('#drop')) return $('#photoInput').click();
    const rm = e.target.closest('[data-rm]'), cv = e.target.closest('[data-cover]');
    if (rm) { editing.photos.splice(+rm.dataset.rm, 1); renderPhotos(); }
    else if (cv) { const [p] = editing.photos.splice(+cv.dataset.cover, 1); editing.photos.unshift(p); renderPhotos(); }
  };
  $('#photoInput').onchange = e => { const f = [...e.target.files]; e.target.value = ''; addFormPhotos(f); };
  const form = $('#form');
  form.addEventListener('dragover', e => { e.preventDefault(); $('#drop')?.classList.add('over'); });
  form.addEventListener('dragleave', e => { if (!form.contains(e.relatedTarget)) $('#drop')?.classList.remove('over'); });
  form.addEventListener('drop', e => { e.preventDefault(); $('#drop')?.classList.remove('over'); addFormPhotos([...e.dataTransfer.files]); });

  $('#tagInput').onkeydown = e => {
    const v = e.target.value;
    if ((e.key === 'Enter' || e.key === ',') && v.trim()) { e.preventDefault(); addTag(v); e.target.value = ''; }
    else if (e.key === 'Enter') e.preventDefault();
    else if (e.key === 'Backspace' && !v && editing.tags.length) { editing.tags.pop(); renderTags(); }
  };
  $('#tagInput').oninput = e => { if (/[,;]/.test(e.target.value)) { addTag(e.target.value); e.target.value = ''; } };
  $('#tagBox').onclick = e => {
    const t = e.target.closest('.tag');
    if (t) { editing.tags.splice(+t.dataset.i, 1); renderTags(); }
    $('#tagInput').focus();
  };

  $('#deleteBtn').onclick = async () => {
    if (!confirm(`¿Eliminar “${editing.name}”? No se puede deshacer.`)) return;
    await dbDel(editing.id);
    items = items.filter(x => x.id !== editing.id);
    $('#formSheet').close(); $('#detailSheet').close(); render(); toast('Eliminado');
  };

  $('#closeDetail').onclick = () => $('#detailSheet').close();
  $('#editBtn').onclick = () => openForm(items.find(x => x.id === currentId));
  $('#lbClose').onclick = () => $('#lightbox').close();
  $('#lightbox').onclick = e => { if (!e.target.closest('#lbClose')) $('#lightbox').close(); };
  for (const d of [$('#formSheet'), $('#detailSheet')]) {
    d.addEventListener('click', e => {
      if (e.target !== d) return;
      const r = d.getBoundingClientRect();
      if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) d.close();
    });
  }

  dbAll().then(list => { items = list || []; render(); })
    .catch(() => { render(); toast('Este navegador no permite guardar datos'); });
})();
</script>
</body>
</html>
