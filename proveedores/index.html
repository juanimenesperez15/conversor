<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Proveedores" />
<meta name="theme-color" content="#000000" />
<meta name="color-scheme" content="dark" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="icon" type="image/png" href="icon-180.png" />
<title>Proveedores in-cosmetics</title>
<style>
  /* Colores del sistema iOS en modo oscuro + violeta in-cosmetics como color de acento */
  :root {
    color-scheme: dark;
    --brand: #784A98;           /* violeta in-cosmetics */
    --tint: #B48BDB;            /* violeta aclarado para texto/íconos sobre negro */
    --tint-fill: rgba(180,139,219,.18);
    --bg: #000000;              /* systemBackground */
    --bg-2: #1C1C1E;            /* secondarySystemBackground */
    --bg-3: #2C2C2E;            /* tertiarySystemBackground */
    --fill: rgba(118,118,128,.24);
    --sep: rgba(84,84,88,.65);
    --label: #FFFFFF;
    --label-2: rgba(235,235,245,.6);
    --label-3: rgba(235,235,245,.3);
    --red: #FF453A;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
    --spring: cubic-bezier(.2,.9,.25,1);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh; background: var(--bg); color: var(--label);
    font-family: var(--font); font-size: 17px; line-height: 1.29; letter-spacing: normal;
    -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none; overscroll-behavior-y: none;
  }
  input, textarea, .selectable { -webkit-user-select: text; user-select: text; }
  button, input, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
  button { cursor: pointer; }
  img { display: block; -webkit-user-drag: none; }
  .hidden { display: none !important; }

  /* ---------- Vidrio (Liquid Glass, modo oscuro) ---------- */
  .glass {
    background: rgba(44,44,48,.55);
    -webkit-backdrop-filter: blur(28px) saturate(180%); backdrop-filter: blur(28px) saturate(180%);
    border: .5px solid rgba(255,255,255,.13);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.16), inset 0 -.5px 0 rgba(255,255,255,.04), 0 8px 28px rgba(0,0,0,.55);
  }
  .glass.tint {
    background: linear-gradient(160deg, rgba(150,105,190,.9), rgba(120,74,152,.88));
    border-color: rgba(230,205,250,.35);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 8px 26px rgba(120,74,152,.45);
  }
  .tap { transition: transform .3s var(--spring), opacity .2s; }
  .tap:active { transform: scale(.94); opacity: .85; }

  /* ---------- Barra de navegación ---------- */
  .nav { position: sticky; top: 0; z-index: 20; padding: env(safe-area-inset-top) 16px 0; }
  .nav::before {
    content: ""; position: absolute; inset: 0 0 -20px; z-index: -1; opacity: 0; transition: opacity .25s;
    background: rgba(0,0,0,.7);
    -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
    -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent);
  }
  .nav.scrolled::before { opacity: 1; }
  .nav-row { max-width: 1100px; margin: 0 auto; height: 56px; display: flex; align-items: center; justify-content: space-between; position: relative; }
  .logo { height: 22px; width: auto; transition: opacity .2s; }
  .nav-title { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -30%); font-size: 17px; font-weight: 600; opacity: 0; transition: all .25s var(--spring); pointer-events: none; }
  .nav.scrolled .nav-title { opacity: 1; transform: translate(-50%, -50%); }
  .nav.scrolled .logo { opacity: 0; }
  .round { width: 44px; height: 44px; border-radius: 50%; border: none; display: grid; place-items: center; color: var(--label); flex: none; padding: 0; }
  .round svg { width: 19px; height: 19px; }

  main { max-width: 1100px; margin: 0 auto; padding: 2px 16px calc(env(safe-area-inset-bottom) + 110px); }
  .large-title { font-size: 34px; line-height: 41px; font-weight: 700; margin: 0; }
  .caption { color: var(--label-2); font-size: 15px; margin: 2px 0 0; }

  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 16px 16px 4px; margin: 0 -16px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; height: 34px; padding: 0 15px; border-radius: 17px; border: none; background: var(--bg-2); color: var(--label); font-size: 15px; font-weight: 500; }
  .chip.on { background: var(--brand); }

  /* ---------- Álbumes (como la app Fotos) ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 22px 16px; margin-top: 18px; }
  @media (max-width: 520px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 14px; } }
  .album { border: none; background: none; padding: 0; text-align: left; min-width: 0; color: inherit; }
  .album .thumb { position: relative; aspect-ratio: 1; border-radius: 14px; overflow: hidden; background: var(--bg-2); transition: transform .3s var(--spring); }
  .album:active .thumb { transform: scale(.96); }
  .album .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .album h3 { margin: 8px 1px 0; font-size: 15px; font-weight: 600; line-height: 20px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .album p { margin: 1px 1px 0; font-size: 13px; line-height: 18px; color: var(--label-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { position: absolute; right: 7px; bottom: 7px; height: 22px; padding: 0 8px; border-radius: 11px; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 4px; }
  .badge svg { width: 12px; height: 12px; }
  .mono {
    width: 100%; height: 100%; display: grid; place-items: center; font-size: 40px; font-weight: 600; color: rgba(255,255,255,.92);
    background: linear-gradient(160deg, #8F63B3, #5E3A77);
  }

  .unavailable { text-align: center; padding: 76px 24px 0; }
  .unavailable svg { width: 54px; height: 54px; color: var(--label-2); }
  .unavailable h2 { font-size: 22px; font-weight: 700; margin: 14px 0 6px; }
  .unavailable p { color: var(--label-2); font-size: 15px; margin: 0 auto; max-width: 300px; }
  .unavailable .cta { margin-top: 20px; height: 44px; padding: 0 22px; border-radius: 22px; border: none; font-size: 17px; font-weight: 600; color: #fff; }

  /* ---------- Barra inferior flotante (iOS 26) ---------- */
  .dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 0 14px calc(env(safe-area-inset-bottom) + 8px); pointer-events: none; }
  .dock::before { content: ""; position: absolute; inset: -40px 0 0; z-index: -1; background: linear-gradient(transparent, rgba(0,0,0,.85)); }
  .dock-row { max-width: 620px; margin: 0 auto; display: flex; gap: 10px; pointer-events: auto; }
  @media (min-width: 900px) { .dock { padding-bottom: 18px; } }
  .search { flex: 1; min-width: 0; height: 50px; border-radius: 25px; display: flex; align-items: center; gap: 8px; padding: 0 16px; }
  .search svg { width: 17px; height: 17px; color: var(--label-2); flex: none; }
  .search input { flex: 1; min-width: 0; border: none; background: none; outline: none; font-size: 17px; }
  .search input::placeholder { color: var(--label-2); }
  .search input::-webkit-search-cancel-button { -webkit-appearance: none; }
  .add { width: 50px; height: 50px; }
  .add svg { width: 22px; height: 22px; }

  /* ---------- Hojas (sheets) ---------- */
  dialog {
    border: none; padding: 0; color: var(--label); overflow: hidden; flex-direction: column;
    width: 100%; max-width: 640px; max-height: none;
    height: calc(100% - env(safe-area-inset-top) - 10px);
    margin: calc(env(safe-area-inset-top) + 10px) auto 0; border-radius: 38px 38px 0 0;
    background: var(--bg-2); box-shadow: 0 -.5px 0 rgba(255,255,255,.12);
  }
  dialog[open] { display: flex; animation: sheet-up .5s var(--spring); }
  dialog::backdrop { background: rgba(0,0,0,.5); animation: fade .35s ease; }
  @keyframes sheet-up { from { transform: translateY(100%); } }
  @keyframes fade { from { opacity: 0; } }
  @keyframes pop { from { transform: scale(.92); opacity: 0; } }
  @media (min-width: 720px) {
    dialog { height: auto; max-height: 88vh; margin: auto; border-radius: 38px; box-shadow: 0 0 0 .5px rgba(255,255,255,.12), 0 40px 100px rgba(0,0,0,.8); }
    dialog[open] { animation: pop .35s var(--spring); }
  }
  .grabber { position: absolute; top: 6px; left: 50%; transform: translateX(-50%); width: 36px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.28); z-index: 5; }
  .sheet-bar { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px; padding: 16px 16px 6px; flex: none; }
  .sheet-bar h2 { margin: 0; text-align: center; font-size: 17px; font-weight: 600; }
  .sheet-bar .round:disabled { opacity: .4; }
  .sheet-bar .round:disabled.tint { background: var(--fill); border-color: transparent; box-shadow: none; }
  .scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }

  /* ---------- Listas agrupadas ---------- */
  .content { padding: 4px 16px calc(env(safe-area-inset-bottom) + 30px); }
  .header { font-size: 13px; color: var(--label-2); text-transform: uppercase; margin: 24px 16px 7px; }
  .footer { font-size: 13px; color: var(--label-2); margin: 7px 16px 0; }
  .group { background: var(--bg-3); border-radius: 26px; overflow: hidden; }
  .cell { position: relative; display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px; }
  .cell + .cell::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: .5px solid var(--sep); }
  .cell input, .cell textarea { flex: 1; min-width: 0; border: none; background: none; outline: none; font-size: 17px; padding: 15px 0; }
  .cell input::placeholder, .cell textarea::placeholder { color: var(--label-3); }
  .cell textarea { resize: none; min-height: 132px; line-height: 22px; padding: 14px 0; }
  .cell .lead { width: 26px; text-align: center; font-size: 20px; flex: none; color: var(--label-3); }
  .cell.name input { font-size: 20px; font-weight: 600; }
  .cell.btn { justify-content: center; border: none; width: 100%; background: none; font-size: 17px; }
  .cell.btn.red { color: var(--red); }

  /* Fotos en el formulario */
  .add-photos {
    width: 100%; border: none; border-radius: 26px; background: var(--bg-3); padding: 28px 16px; color: var(--tint);
    display: flex; flex-direction: column; align-items: center; gap: 10px; font-size: 17px; font-weight: 600;
  }
  .add-photos .ic { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; color: #fff; }
  .add-photos .ic svg { width: 26px; height: 26px; }
  .add-photos small { color: var(--label-2); font-size: 13px; font-weight: 400; }
  .add-photos.over { outline: 2px solid var(--tint); }
  .pick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-top: 6px; }
  .pick button { height: 46px; border-radius: 23px; border: none; font-size: 16px; font-weight: 600; color: #fff; display: flex; align-items: center; justify-content: center; gap: 7px; }
  .pick button svg { width: 19px; height: 19px; }
  .add-photos { cursor: default; }
  .strip { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
  .strip::-webkit-scrollbar { display: none; }
  .ph { position: relative; flex: none; width: 112px; height: 112px; border-radius: 14px; overflow: hidden; background: var(--bg-3); }
  .ph img { width: 100%; height: 100%; object-fit: cover; }
  .ph .x { position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; border-radius: 50%; border: none; padding: 0; display: grid; place-items: center; color: #fff; }
  .ph .x svg { width: 10px; height: 10px; }
  .ph .cover { position: absolute; left: 6px; bottom: 6px; height: 22px; padding: 0 8px; border-radius: 11px; font-size: 11px; font-weight: 600; display: flex; align-items: center; }
  .ph .mk { position: absolute; inset: 0; border: none; background: none; }
  .ph-add { flex: none; width: 112px; height: 112px; border-radius: 14px; border: none; background: var(--bg-3); color: var(--tint); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 13px; font-weight: 600; }
  .ph-add svg { width: 26px; height: 26px; }

  /* Activos */
  .tokens { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 14px; min-height: 52px; cursor: text; }
  .tokens input { flex: 1; min-width: 140px; border: none; background: none; outline: none; font-size: 17px; padding: 5px 2px; }
  .tokens input::placeholder { color: var(--label-3); }
  .token { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 13px; border-radius: 16px; border: none; background: var(--tint-fill); color: #E3D0F5; font-size: 15px; font-weight: 500; }
  .token svg { width: 9px; height: 9px; opacity: .7; }

  /* ---------- Detalle ---------- */
  #detailSheet { background: var(--bg-2); }
  .d-top { position: absolute; top: 0; left: 0; right: 0; z-index: 4; display: flex; justify-content: space-between; padding: 16px; pointer-events: none; }
  .d-top > * { pointer-events: auto; }
  .capsule { height: 44px; padding: 0 18px; border-radius: 22px; border: none; font-size: 17px; font-weight: 600; color: #fff; }
  .hero { position: relative; background: #000; }
  .gallery { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; width: 100%; aspect-ratio: 1; max-height: 58vh; }
  .gallery::-webkit-scrollbar { display: none; }
  .gallery img { flex: none; width: 100%; height: 100%; object-fit: cover; scroll-snap-align: center; }
  .gallery .mono { flex: none; font-size: 72px; }
  .dots { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; gap: 7px; padding: 7px 10px; border-radius: 12px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.35); transition: background .2s; }
  .dots i.on { background: #fff; }
  .d-head { padding: 20px 20px 0; }
  .d-head h1 { margin: 0; font-size: 28px; line-height: 34px; font-weight: 700; }
  .d-head p { margin: 4px 0 0; font-size: 17px; color: var(--label-2); }
  .d-tokens { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px; }
  .d-notes { margin: 0; padding: 14px 16px; font-size: 17px; line-height: 22px; white-space: pre-wrap; word-break: break-word; }
  .d-empty { margin: 0; padding: 15px 16px; color: var(--label-3); }
  .d-photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .d-photos img, .d-photos button { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 14px; }
  .d-photos button { border: none; background: var(--bg-3); color: var(--tint); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 13px; font-weight: 600; }
  .d-photos button svg { width: 24px; height: 24px; }
  .d-date { text-align: center; color: var(--label-3); font-size: 13px; margin: 24px 0 0; }

  #lightbox { background: #000; width: 100vw; max-width: none; height: 100vh; height: 100dvh; margin: 0; border-radius: 0; box-shadow: none; }
  #lightbox img { width: 100%; height: 100%; object-fit: contain; }
  #lightbox .round { position: absolute; top: calc(env(safe-area-inset-top) + 10px); right: 16px; }

  /* ---------- Menú contextual y aviso ---------- */
  .menu {
    position: fixed; z-index: 40; right: 16px; top: calc(env(safe-area-inset-top) + 60px); width: 280px; border-radius: 22px; overflow: hidden; padding: 6px 0;
    background: rgba(40,40,44,.72); transform-origin: top right; animation: pop .25s var(--spring);
  }
  .menu button { display: flex; align-items: center; justify-content: space-between; width: 100%; border: none; background: none; padding: 11px 18px; font-size: 17px; text-align: left; }
  .menu button:active { background: rgba(255,255,255,.1); }
  .menu svg { width: 19px; height: 19px; }
  .toast {
    position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 10px); z-index: 60; height: 44px; padding: 0 20px; border-radius: 22px;
    display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; white-space: nowrap;
    opacity: 0; transform: translate(-50%, -12px) scale(.9); transition: all .4s var(--spring); pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }

  @media (prefers-reduced-motion: reduce) { *, ::backdrop { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<header class="nav" id="nav">
  <div class="nav-row">
    <img class="logo" src="logo.svg" alt="in-cosmetics" />
    <div class="nav-title">Proveedores</div>
    <button class="round glass tap" id="menuBtn" aria-label="Más opciones">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
    </button>
  </div>
</header>

<div class="menu glass hidden" id="menu">
  <button data-act="xlsx">Exportar a Excel (con fotos)
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></button>
  <button data-act="export">Descargar copia
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 10l5 5 5-5M5 21h14"/></svg></button>
  <button data-act="import">Restaurar copia
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5M5 21h14"/></svg></button>
</div>
<input type="file" id="importFile" accept="application/json,.json" hidden />

<main>
  <h1 class="large-title">Proveedores</h1>
  <p class="caption" id="lede"></p>
  <div class="chips" id="chips"></div>
  <section class="grid" id="grid"></section>
  <div class="unavailable hidden" id="empty"></div>
</main>

<nav class="dock">
  <div class="dock-row">
    <label class="search glass">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Buscar" autocomplete="off" enterkeyhint="search" />
    </label>
    <button class="round add glass tap" id="camBtn" aria-label="Sacar foto a un proveedor nuevo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5A1.5 1.5 0 0 1 5 7h2.2l1.6-2.2h6.4L16.8 7H19a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 19 19H5a1.5 1.5 0 0 1-1.5-1.5z"/><circle cx="12" cy="12.8" r="3.4"/></svg>
    </button>
    <button class="round add glass tint tap" id="addBtn" aria-label="Nuevo proveedor">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>
</nav>

<!-- Formulario -->
<dialog id="formSheet">
  <div class="grabber"></div>
  <div class="sheet-bar">
    <button class="round glass tap" id="cancelBtn" type="button" aria-label="Cancelar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <h2 id="formTitle">Nuevo proveedor</h2>
    <button class="round glass tint tap" id="saveBtn" type="button" aria-label="Guardar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>
    </button>
  </div>
  <div class="scroll">
    <form class="content" id="form" autocomplete="off" onsubmit="return false">
      <div class="header" style="margin-top:12px">Fotos</div>
      <div id="photos"></div>

      <div class="header">Proveedor</div>
      <div class="group">
        <div class="cell name"><input id="f-name" placeholder="Nombre" /></div>
        <div class="cell"><span class="lead" id="flagLead">🌐</span><input id="f-country" list="countryList" placeholder="País" autocomplete="off" /></div>
      </div>
      <datalist id="countryList"></datalist>

      <div class="header">Activos que trabaja</div>
      <div class="group">
        <div class="tokens" id="tagBox"><input id="tagInput" list="tagList" placeholder="Agregar activo" enterkeyhint="done" /></div>
      </div>
      <datalist id="tagList"></datalist>
      <div class="footer">Escribí un activo y tocá Intro para agregarlo.</div>

      <div class="header">Notas</div>
      <div class="group">
        <div class="cell"><textarea id="f-notes" placeholder="Opcional: contacto, precios, stand…"></textarea></div>
      </div>

      <div class="group hidden" id="deleteWrap" style="margin-top:32px">
        <button type="button" class="cell btn red" id="deleteBtn">Eliminar proveedor</button>
      </div>
    </form>
  </div>
</dialog>

<!-- Detalle -->
<dialog id="detailSheet">
  <div class="d-top">
    <button class="round glass tap" id="closeDetail" aria-label="Cerrar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <button class="capsule glass tap" id="editBtn">Editar</button>
  </div>
  <div class="scroll" id="detail"></div>
</dialog>
<input type="file" id="camIn" accept="image/*" capture="environment" hidden />
<input type="file" id="libIn" accept="image/*" multiple hidden />

<dialog id="lightbox">
  <img id="lbImg" alt="" />
  <button class="round glass tap" id="lbClose" aria-label="Cerrar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
  </button>
</dialog>

<div class="toast glass" id="toast"></div>

<script>
(() => {
  // ---------- IndexedDB (misma base de siempre, los datos se conservan) ----------
  const DB_NAME = 'inncosmetic-proveedores', STORE = 'proveedores';
  const dbp = new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE, { keyPath: 'id' });
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  async function run(mode, fn) {
    const db = await dbp;
    return new Promise((res, rej) => {
      const t = db.transaction(STORE, mode);
      const req = fn(t.objectStore(STORE));
      t.oncomplete = () => res(req && req.result);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error);
    });
  }
  const dbAll = () => run('readonly', s => s.getAll());
  const dbPut = item => run('readwrite', s => s.put(item));
  const dbDel = id => run('readwrite', s => s.delete(id));
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

  // ---------- Estado y utilidades ----------
  let items = [];
  const view = { q: '', tag: null };
  let editing = null, currentId = null;

  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
  const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
  const initials = n => (n || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
  const collator = new Intl.Collator('es', { sensitivity: 'base' });
  const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
  const X_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';
  const CAM_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5A1.5 1.5 0 0 1 5 7h2.2l1.6-2.2h6.4L16.8 7H19a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 19 19H5a1.5 1.5 0 0 1-1.5-1.5z"/><circle cx="12" cy="12.8" r="3.4"/></svg>';
  const LIB_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="m20.5 15.5-4.5-4.5-8 8.5"/></svg>';
  const STACK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="7" width="13" height="13" rx="2.5"/><path d="M4 16V6.5A2.5 2.5 0 0 1 6.5 4H16"/></svg>';
  const CHECK_ICON = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';

  const COUNTRIES = {
    'Alemania':'DE','Argentina':'AR','Australia':'AU','Austria':'AT','Bélgica':'BE','Bolivia':'BO','Brasil':'BR','Bulgaria':'BG',
    'Canadá':'CA','Chile':'CL','China':'CN','Colombia':'CO','Corea del Sur':'KR','Costa Rica':'CR','Croacia':'HR','Dinamarca':'DK',
    'Ecuador':'EC','Egipto':'EG','Emiratos Árabes Unidos':'AE','Eslovenia':'SI','España':'ES','Estados Unidos':'US','Filipinas':'PH',
    'Finlandia':'FI','Francia':'FR','Grecia':'GR','Guatemala':'GT','Hungría':'HU','India':'IN','Indonesia':'ID','Irlanda':'IE',
    'Israel':'IL','Italia':'IT','Japón':'JP','Malasia':'MY','Marruecos':'MA','México':'MX','Noruega':'NO','Nueva Zelanda':'NZ',
    'Países Bajos':'NL','Paraguay':'PY','Perú':'PE','Polonia':'PL','Portugal':'PT','Reino Unido':'GB','República Checa':'CZ',
    'Rumania':'RO','Singapur':'SG','Sudáfrica':'ZA','Suecia':'SE','Suiza':'CH','Tailandia':'TH','Taiwán':'TW','Turquía':'TR',
    'Ucrania':'UA','Uruguay':'UY','Venezuela':'VE','Vietnam':'VN'
  };
  const ALIASES = { 'eeuu':'US','usa':'US','ee.uu.':'US','holanda':'NL','uk':'GB','inglaterra':'GB','corea':'KR','uae':'AE','emiratos':'AE' };
  const COUNTRY_BY_NORM = Object.fromEntries(Object.entries(COUNTRIES).map(([n, c]) => [norm(n), c]));
  const flagOf = name => {
    const code = COUNTRY_BY_NORM[norm(name)] || ALIASES[norm(name)];
    return code ? String.fromCodePoint(...[...code].map(ch => 127397 + ch.charCodeAt(0))) : '';
  };
  const countryLabel = p => p.country ? [flagOf(p.country), p.country].filter(Boolean).join(' ') : '';

  function toast(msg) {
    const t = $('#toast'); t.innerHTML = CHECK_ICON + esc(msg); t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1900);
  }

  function compress(file, max = 1800, q = .84) {
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(file), img = new Image();
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q));
      };
      img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
      img.src = url;
    });
  }
  async function readPhotos(files) {
    const out = [];
    for (const f of files) {
      if (!f.type.startsWith('image/') && !/\.(heic|heif)$/i.test(f.name)) continue;
      try { out.push(await compress(f)); } catch { toast('Una foto no se pudo leer'); }
    }
    return out;
  }

  // ---------- Listado ----------
  function tagCounts() {
    const m = new Map();
    for (const p of items) for (const t of p.tags || []) {
      const k = norm(t); const e = m.get(k) || { label: t, n: 0 }; e.n++; m.set(k, e);
    }
    return [...m.values()].sort((a, b) => b.n - a.n || collator.compare(a.label, b.label));
  }

  function filtered() {
    const q = norm(view.q);
    return items
      .filter(p => !view.tag || (p.tags || []).some(t => norm(t) === norm(view.tag)))
      .filter(p => !q || norm([p.name, p.country, (p.tags || []).join(' '), p.notes].join(' ')).includes(q))
      .sort((a, b) => collator.compare(a.name, b.name));
  }

  function render() {
    const all = tagCounts(), tags = all.slice(0, 14);
    if (view.tag && !tags.some(t => norm(t.label) === norm(view.tag))) view.tag = null;
    $('#chips').innerHTML = tags.length ? [`<button class="chip tap ${view.tag ? '' : 'on'}" data-tag="">Todos</button>`,
      ...tags.map(t => `<button class="chip tap ${norm(t.label) === norm(view.tag) ? 'on' : ''}" data-tag="${esc(t.label)}">${esc(t.label)}</button>`)].join('') : '';
    $('#chips').classList.toggle('hidden', !tags.length);
    $('#lede').textContent = items.length ? `${plural(items.length, 'proveedor', 'proveedores')} · ${plural(all.length, 'activo', 'activos')}` : '';

    const list = filtered();
    $('#grid').innerHTML = list.map(p => {
      const photos = p.photos || [], tags = p.tags || [];
      const sub = [countryLabel(p), tags.join(', ')].filter(Boolean).join(' · ') || 'Sin activos';
      return `<button class="album" data-id="${p.id}">
        <div class="thumb">
          ${photos[0] ? `<img src="${photos[0]}" alt="" loading="lazy" />` : `<div class="mono">${esc(initials(p.name))}</div>`}
          ${photos.length > 1 ? `<span class="badge glass">${STACK_ICON}${photos.length}</span>` : ''}
        </div>
        <h3>${esc(p.name)}</h3>
        <p>${esc(sub)}</p>
      </button>`;
    }).join('');

    const empty = $('#empty');
    empty.innerHTML = !items.length
      ? `${CAM_ICON}<h2>Sin proveedores</h2><p>Sacale una foto a cada proveedor y anotá qué activos trabaja.</p><button class="cta glass tint tap" data-act="add">Agregar proveedor</button>`
      : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><h2>Sin resultados</h2><p>No hay coincidencias para “${esc(view.q || view.tag)}”.</p>`;
    empty.classList.toggle('hidden', list.length > 0);
  }

  // ---------- Detalle ----------
  function openDetail(id) {
    const p = items.find(x => x.id === id); if (!p) return;
    currentId = id;
    const photos = p.photos || [], tags = p.tags || [];
    const date = new Date(p.updatedAt || p.createdAt || Date.now()).toLocaleDateString('es-UY', { day: 'numeric', month: 'long', year: 'numeric' });
    $('#detail').innerHTML = `
      <div class="hero">
        <div class="gallery" id="gallery">
          ${photos.length ? photos.map((s, i) => `<img src="${s}" data-i="${i}" alt="" />`).join('') : `<div class="mono" style="width:100%">${esc(initials(p.name))}</div>`}
        </div>
        ${photos.length > 1 ? `<div class="dots glass">${photos.map((_, i) => `<i class="${i ? '' : 'on'}"></i>`).join('')}</div>` : ''}
      </div>
      <div class="d-head">
        <h1 class="selectable">${esc(p.name)}</h1>
        ${p.country ? `<p>${esc(countryLabel(p))}</p>` : ''}
      </div>
      <div class="content">
        <div class="header">Activos que trabaja</div>
        <div class="group">${tags.length ? `<div class="d-tokens">${tags.map(t => `<span class="token">${esc(t)}</span>`).join('')}</div>` : '<p class="d-empty">Sin activos cargados</p>'}</div>
        ${p.notes ? `<div class="header">Notas</div><div class="group"><p class="d-notes selectable">${esc(p.notes)}</p></div>` : ''}
        <div class="header">${photos.length ? plural(photos.length, 'foto', 'fotos') : 'Fotos'}</div>
        <div class="d-photos">
          ${photos.map((s, i) => `<img src="${s}" data-i="${i}" alt="" loading="lazy" />`).join('')}
          <button type="button" data-pick="cam">${CAM_ICON}Cámara</button>
          <button type="button" data-pick="lib">${LIB_ICON}Fototeca</button>
        </div>
        <p class="d-date">Actualizado el ${date}</p>
      </div>`;
    const g = $('#gallery');
    g.addEventListener('scroll', () => {
      const i = Math.round(g.scrollLeft / g.clientWidth);
      document.querySelectorAll('.dots i').forEach((d, j) => d.classList.toggle('on', i === j));
    }, { passive: true });
    const sheet = $('#detailSheet');
    if (!sheet.open) sheet.showModal();
    $('#detail').scrollTop = 0;
  }

  $('#detail').onclick = e => {
    const pk = e.target.closest('[data-pick]');
    if (pk) return pickPhotos('detail', pk.dataset.pick);
    const img = e.target.closest('img[data-i]');
    if (img) { $('#lbImg').src = img.src; $('#lightbox').showModal(); }
  };
  // ---------- Cámara y fototeca ----------
  let pickTarget = 'form';
  function pickPhotos(target, source) { pickTarget = target; $(source === 'cam' ? '#camIn' : '#libIn').click(); }
  for (const id of ['#camIn', '#libIn']) $(id).onchange = e => {
    const files = [...e.target.files]; e.target.value = '';
    if (!files.length) return;
    if (pickTarget === 'form') addFormPhotos(files);
    else if (pickTarget === 'detail') addDetailPhotos(files);
    else newWithPhotos(files);
  };
  async function newWithPhotos(files) {
    const photos = await readPhotos(files); if (!photos.length) return;
    openForm(); editing.photos = photos; renderPhotos();
    setTimeout(() => $('#f-name').focus(), 450);
  }
  async function addDetailPhotos(files) {
    const p = items.find(x => x.id === currentId); if (!p) return;
    const added = await readPhotos(files); if (!added.length) return;
    const next = { ...p, photos: [...(p.photos || []), ...added], updatedAt: Date.now() };
    try { await dbPut(next); } catch { return toast('No hay espacio para guardar'); }
    items[items.indexOf(p)] = next; render(); openDetail(p.id);
    toast(added.length === 1 ? 'Foto agregada' : `${added.length} fotos agregadas`);
  }

  // ---------- Formulario ----------
  function openForm(p) {
    const isNew = !p;
    editing = structuredClone(p || { id: uid(), name: '', country: '', tags: [], notes: '', photos: [] });
    editing.tags = editing.tags || []; editing.photos = editing.photos || [];
    $('#formTitle').textContent = isNew ? 'Nuevo proveedor' : 'Editar';
    $('#deleteWrap').classList.toggle('hidden', isNew);
    $('#f-name').value = editing.name || '';
    $('#f-country').value = editing.country || '';
    $('#f-notes').value = editing.notes || '';
    $('#tagInput').value = '';
    $('#tagList').innerHTML = tagCounts().map(t => `<option value="${esc(t.label)}">`).join('');
    $('#countryList').innerHTML = [...new Set([...items.map(x => x.country).filter(Boolean), ...Object.keys(COUNTRIES)])].map(c => `<option value="${esc(c)}">`).join('');
    renderPhotos(); renderTags(); updateSave(); updateFlag();
    const sheet = $('#formSheet');
    if (!sheet.open) sheet.showModal();
    sheet.querySelector('.scroll').scrollTop = 0;
  }

  function renderPhotos() {
    const ph = editing.photos;
    $('#photos').innerHTML = !ph.length
      ? `<div class="add-photos" id="drop"><span class="ic glass tint">${CAM_ICON}</span>Fotos del proveedor<small>Del stand, los productos o la tarjeta</small>
          <div class="pick"><button type="button" class="glass tint tap" data-pick="cam">${CAM_ICON}Cámara</button><button type="button" class="glass tap" data-pick="lib">${LIB_ICON}Fototeca</button></div></div>`
      : `<div class="strip">${ph.map((s, i) => `
          <div class="ph"><img src="${s}" alt="" />
            ${i ? `<button type="button" class="mk" data-cover="${i}" aria-label="Usar como portada"></button>` : '<span class="cover glass">Portada</span>'}
            <button type="button" class="x glass" data-rm="${i}" aria-label="Quitar foto">${X_ICON}</button>
          </div>`).join('')}
          <button type="button" class="ph-add tap" id="drop" data-pick="cam">${CAM_ICON}Cámara</button>
          <button type="button" class="ph-add tap" data-pick="lib">${LIB_ICON}Fototeca</button>
        </div><div class="footer">Tocá una foto para usarla de portada.</div>`;
  }
  function renderTags() {
    const box = $('#tagBox'), input = $('#tagInput');
    box.querySelectorAll('.token').forEach(t => t.remove());
    editing.tags.forEach((t, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'token'; b.dataset.i = i; b.innerHTML = esc(t) + X_ICON;
      b.setAttribute('aria-label', `Quitar ${t}`);
      box.insertBefore(b, input);
    });
  }
  function addTag(raw) {
    raw.split(/[,;\n]/).map(s => s.trim()).filter(Boolean).forEach(t => {
      if (!editing.tags.some(x => norm(x) === norm(t))) editing.tags.push(t);
    });
    renderTags();
  }
  function updateSave() { $('#saveBtn').disabled = !$('#f-name').value.trim(); }
  function updateFlag() { $('#flagLead').textContent = flagOf($('#f-country').value) || '🌐'; }

  async function save() {
    const name = $('#f-name').value.trim();
    if (!name) return $('#f-name').focus();
    if ($('#tagInput').value.trim()) addTag($('#tagInput').value);
    editing.name = name;
    editing.country = $('#f-country').value.trim();
    editing.notes = $('#f-notes').value.trim();
    const now = Date.now();
    editing.createdAt = editing.createdAt || now; editing.updatedAt = now;
    try { await dbPut(editing); } catch { return toast('No hay espacio para guardar'); }
    const i = items.findIndex(x => x.id === editing.id);
    if (i >= 0) items[i] = editing; else items.push(editing);
    const id = editing.id, wasOpen = $('#detailSheet').open;
    $('#formSheet').close(); render(); toast('Guardado');
    if (wasOpen) openDetail(id);
  }

  async function addFormPhotos(files) {
    if (!files.length) return;
    editing.photos.push(...await readPhotos(files)); renderPhotos();
  }

  // ---------- Copias ----------
  function download(name, content, type) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([content], { type })); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  const today = () => new Date().toISOString().slice(0, 10);
  function exportJSON() {
    if (!items.length) return toast('Todavía no hay proveedores');
    shareOrDownload(`proveedores-${today()}.json`, new Blob([JSON.stringify({ app: 'inncosmetic-proveedores', version: 4, exportedAt: new Date().toISOString(), items })], { type: 'application/json' }));
    toast('Copia descargada');
  }
  // Excel (.xlsx) con las fotos dentro de las celdas. ExcelJS se carga solo al exportar.
  let excelLib = null;
  function loadExcel() {
    return excelLib || (excelLib = new Promise((res, rej) => {
      const sc = document.createElement('script');
      sc.src = 'https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js';
      sc.onload = () => res(window.ExcelJS);
      sc.onerror = () => { excelLib = null; rej(new Error('sin conexión')); };
      document.head.appendChild(sc);
    }));
  }
  function squareThumb(src, size = 360) {
    return new Promise(res => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas'); c.width = c.height = size;
        const k = Math.min(img.naturalWidth, img.naturalHeight);
        c.getContext('2d').drawImage(img, (img.naturalWidth - k) / 2, (img.naturalHeight - k) / 2, k, k, 0, 0, size, size);
        res(c.toDataURL('image/jpeg', .82));
      };
      img.onerror = () => res(null);
      img.src = src;
    });
  }
  async function shareOrDownload(name, blob) {
    const file = new File([blob], name, { type: blob.type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: name }); return; }
      catch (err) { if (err && err.name === 'AbortError') return; }
    }
    download(name, blob, blob.type);
  }
  async function exportXLSX() {
    if (!items.length) return toast('Todavía no hay proveedores');
    toast('Armando el Excel…');
    let ExcelJS;
    try { ExcelJS = await loadExcel(); } catch { return toast('Se necesita internet para exportar'); }
    const list = [...items].sort((a, b) => collator.compare(a.name, b.name));
    const maxPhotos = Math.max(1, ...list.map(p => (p.photos || []).length));
    const PX = 130;                                   // tamaño de cada foto en la planilla
    const wb = new ExcelJS.Workbook(); wb.creator = 'Proveedores in-cosmetics';
    const ws = wb.addWorksheet('Proveedores', { views: [{ state: 'frozen', ySplit: 1 }] });
    const photoCols = Array.from({ length: maxPhotos }, (_, i) => ({ header: i ? `Foto ${i + 1}` : 'Foto', key: `f${i}`, width: 19 }));
    ws.columns = [
      photoCols[0],
      { header: 'Proveedor', key: 'name', width: 26 },
      { header: 'País', key: 'country', width: 16 },
      { header: 'Activos que trabaja', key: 'tags', width: 34 },
      { header: 'Notas', key: 'notes', width: 40 },
      { header: 'Cant. fotos', key: 'n', width: 11 },
      ...photoCols.slice(1),
    ];
    const head = ws.getRow(1);
    head.height = 24;
    head.eachCell(c => {
      c.font = { bold: true, color: { argb: 'FFFFFFFF' } };
      c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF784A98' } };
      c.alignment = { vertical: 'middle', horizontal: 'center' };
    });
    const extraStart = 6;                              // columna (0-based) donde empiezan Foto 2, Foto 3…
    for (const [i, p] of list.entries()) {
      const r = i + 2, photos = p.photos || [];
      const row = ws.getRow(r);
      row.values = { name: p.name, country: p.country || '', tags: (p.tags || []).join(', '), notes: p.notes || '', n: photos.length };
      row.height = PX * .75 + 8;
      row.eachCell({ includeEmpty: true }, c => { c.alignment = { vertical: 'middle', wrapText: true }; });
      row.getCell('name').font = { bold: true };
      for (const [j, src] of photos.entries()) {
        const thumb = await squareThumb(src); if (!thumb) continue;
        const id = wb.addImage({ base64: thumb, extension: 'jpeg' });
        const col = j === 0 ? 0 : extraStart + j - 1;
        ws.addImage(id, { tl: { col: col + .06, row: r - 1 + .04 }, ext: { width: PX, height: PX }, editAs: 'oneCell' });
      }
    }
    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    await shareOrDownload(`proveedores-${today()}.xlsx`, blob);
    toast('Excel listo');
  }
  async function importJSON(file) {
    try {
      const data = JSON.parse(await file.text());
      const list = Array.isArray(data) ? data : data.items;
      if (!Array.isArray(list)) throw 0;
      let n = 0;
      for (const p of list) {
        if (!p || typeof p.name !== 'string') continue;
        const item = { tags: [], photos: [], notes: '', country: '', ...p, id: p.id || uid() };
        await dbPut(item);
        const i = items.findIndex(x => x.id === item.id);
        if (i >= 0) items[i] = item; else items.push(item);
        n++;
      }
      render(); toast(`${plural(n, 'proveedor restaurado', 'proveedores restaurados')}`);
    } catch { toast('Ese archivo no es una copia válida'); }
  }

  // ---------- Deslizar hacia abajo para cerrar (como en iOS) ----------
  function swipeToClose(d) {
    const sc = d.querySelector('.scroll');
    let y0 = null, dy = 0, drag = false;
    d.addEventListener('touchstart', e => {
      if (e.target.closest('input, textarea, .strip') || matchMedia('(min-width: 720px)').matches) { y0 = null; return; }
      y0 = e.touches[0].clientY; dy = 0; drag = false;
    }, { passive: true });
    d.addEventListener('touchmove', e => {
      if (y0 === null) return;
      const m = e.touches[0].clientY - y0;
      if (!drag) {
        if (m > 8 && sc.scrollTop <= 0) { drag = true; d.style.transition = 'none'; }
        else if (Math.abs(m) > 8) { y0 = null; return; }
      }
      if (drag) { dy = Math.max(0, m); d.style.transform = `translateY(${dy}px)`; e.preventDefault(); }
    }, { passive: false });
    d.addEventListener('touchend', () => {
      if (!drag) { y0 = null; return; }
      d.style.transition = 'transform .32s cubic-bezier(.2,.9,.25,1)';
      if (dy > 120) {
        d.style.transform = 'translateY(110%)';
        setTimeout(() => { d.close(); d.style.transform = ''; d.style.transition = ''; }, 300);
      } else {
        d.style.transform = '';
        setTimeout(() => { d.style.transition = ''; }, 320);
      }
      y0 = null; drag = false;
    });
  }
  swipeToClose($('#formSheet')); swipeToClose($('#detailSheet'));

  // ---------- Eventos ----------
  $('#addBtn').onclick = () => openForm();
  $('#camBtn').onclick = () => pickPhotos('new', 'cam');
  $('#empty').onclick = e => { if (e.target.closest('[data-act="add"]')) openForm(); };
  $('#q').oninput = e => { view.q = e.target.value; render(); };
  $('#q').onkeydown = e => { if (e.key === 'Enter') e.target.blur(); };
  $('#chips').onclick = e => { const b = e.target.closest('[data-tag]'); if (b) { view.tag = b.dataset.tag || null; render(); } };
  $('#grid').onclick = e => { const c = e.target.closest('.album'); if (c) openDetail(c.dataset.id); };
  addEventListener('scroll', () => $('#nav').classList.toggle('scrolled', scrollY > 44), { passive: true });

  const menu = $('#menu');
  $('#menuBtn').onclick = e => { e.stopPropagation(); menu.classList.toggle('hidden'); };
  document.addEventListener('click', e => { if (!menu.contains(e.target)) menu.classList.add('hidden'); });
  menu.onclick = e => {
    const act = e.target.closest('[data-act]')?.dataset.act; if (!act) return;
    menu.classList.add('hidden');
    ({ export: exportJSON, xlsx: exportXLSX, import: () => $('#importFile').click() })[act]();
  };
  $('#importFile').onchange = e => { const f = e.target.files[0]; if (f) importJSON(f); e.target.value = ''; };

  $('#cancelBtn').onclick = () => $('#formSheet').close();
  $('#saveBtn').onclick = save;
  $('#f-name').oninput = updateSave;
  $('#f-country').oninput = updateFlag;
  $('#f-name').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); $('#f-country').focus(); } };
  $('#f-country').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); $('#tagInput').focus(); } };

  $('#photos').onclick = e => {
    const pk = e.target.closest('[data-pick]');
    if (pk) return pickPhotos('form', pk.dataset.pick);
    const rm = e.target.closest('[data-rm]'), cv = e.target.closest('[data-cover]');
    if (rm) { editing.photos.splice(+rm.dataset.rm, 1); renderPhotos(); }
    else if (cv) { const [p] = editing.photos.splice(+cv.dataset.cover, 1); editing.photos.unshift(p); renderPhotos(); }
  };
  const form = $('#form');
  form.addEventListener('dragover', e => { e.preventDefault(); $('#drop')?.classList.add('over'); });
  form.addEventListener('dragleave', e => { if (!form.contains(e.relatedTarget)) $('#drop')?.classList.remove('over'); });
  form.addEventListener('drop', e => { e.preventDefault(); $('#drop')?.classList.remove('over'); addFormPhotos([...e.dataTransfer.files]); });

  $('#tagInput').onkeydown = e => {
    const v = e.target.value;
    if ((e.key === 'Enter' || e.key === ',') && v.trim()) { e.preventDefault(); addTag(v); e.target.value = ''; }
    else if (e.key === 'Enter') e.preventDefault();
    else if (e.key === 'Backspace' && !v && editing.tags.length) { editing.tags.pop(); renderTags(); }
  };
  $('#tagInput').oninput = e => { if (/[,;]/.test(e.target.value)) { addTag(e.target.value); e.target.value = ''; } };
  $('#tagBox').onclick = e => {
    const t = e.target.closest('.token');
    if (t) { editing.tags.splice(+t.dataset.i, 1); renderTags(); }
    $('#tagInput').focus();
  };

  $('#deleteBtn').onclick = async () => {
    if (!confirm(`¿Eliminar “${editing.name}”? No se puede deshacer.`)) return;
    await dbDel(editing.id);
    items = items.filter(x => x.id !== editing.id);
    $('#formSheet').close(); $('#detailSheet').close(); render(); toast('Eliminado');
  };

  $('#closeDetail').onclick = () => $('#detailSheet').close();
  $('#editBtn').onclick = () => openForm(items.find(x => x.id === currentId));
  $('#lbClose').onclick = () => $('#lightbox').close();
  $('#lightbox').onclick = e => { if (!e.target.closest('#lbClose')) $('#lightbox').close(); };
  for (const d of [$('#formSheet'), $('#detailSheet')]) {
    d.addEventListener('click', e => {
      if (e.target !== d) return;
      const r = d.getBoundingClientRect();
      if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) d.close();
    });
  }

  dbAll().then(list => { items = list || []; render(); })
    .catch(() => { render(); toast('Este navegador no permite guardar datos'); });
})();
</script>
</body>
</html>
